ai.reasoningHelp=Turning reasoning off cuts latency sharply. A local reasoning model (Qwen3 on Ollama, say) spends its whole output budget thinking when it is left on, and the draft comes back empty. The parameter is only sent when you pick a level explicitly, so "endpoint default" is the safe choice. Off only holds on OpenAI-compatible endpoints: the official OpenAI reasoning models do not all accept "none" — the o-series starts at "low", and "none" is accepted only from gpt-5.1 on. A value the endpoint does not know comes back as its own 400.
