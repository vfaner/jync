project.schedule.cdcHidden=Log CDC mode: a long-running consumer streams changes continuously, so Quartz polling, cron, poll interval, and per-table cursor columns are ignored. Switch back to Polling or Full compare to restore them. Full-load performance is independent of the schedule and stays editable in the card below.
