ai.privacyTitle=Before you enable this
ai.privacyBody=Testing and conversion send requests to the endpoint you configure, and a conversion includes the procedure's source. That source often encodes business rules and table structure. On an intranet or a regulated deployment, prefer a local or in-house inference endpoint, and confirm you are permitted to send this code off-site. With no provider enabled the tool makes no outbound request at all; set sync.ai.enabled=false to remove the feature entirely.
