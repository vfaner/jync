settings.safetyLagHelp=The persisted watermark is rewound by this much so a source transaction that commits out of clock order is re-read rather than skipped.
settings.fullCompareMax=Full-comparison row ceiling
settings.lockTtl=Sync lock lease
settings.lockTtlHelp=How long a lock is held before a crashed instance's lease can be reclaimed.
settings.snapshotDir=Snapshot directory
settings.supportedDatabases=Supported databases
settings.configNote=These values come from application.yml and are read-only here. Edit the file and restart to change them.
settings.concurrency=Concurrency and recovery
settings.concurrencyNote=Only one sync runs per project at a time, enforced at three levels: the Quartz job forbids overlapping fires, a JVM lock covers manual runs in the same process, and a database lease with an expiry covers other processes while still allowing a crashed owner's lock to be reclaimed. Each table's cursor advances only after its rows are committed to the target, so a crash replays the last window rather than skipping it; because every write is an upsert keyed on the primary key, the replay is harmless.

