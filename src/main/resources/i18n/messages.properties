project.lock.held=Held
project.lock.expired=Expired
project.lock.stale=Left by the previous round (expired)
project.lock.staleHelp=This lease was left behind by the previous round. It has expired and no round is running here, so it blocks nothing: the next round takes it over directly. No action needed.
project.lock.until=lease until
project.lock.forceUnlock=Force unlock
project.confirm.forceUnlock=Force-release the sync lock held by "{0}"? If the holder is still running it aborts at its next write; only use this when it is stuck or gone.
