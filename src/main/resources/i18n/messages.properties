option.customSchedule=Custom schedule
option.customScheduleHelp=Enable to set poll interval / cron; leave off to use global defaults
option.fullLoadParallelism=Parallelism
option.fullLoadParallelismHelp=Parallel workers for the initial full load (1 = sequential). Applies only to large tables with a single-column integer primary key, and the effective value is capped by the connection pool. Set to 1 when the database is sensitive. Leave blank for the global default ({0}).
option.fullLoadParallelismTip=Recommended 1-4 (default {0}). Each worker holds one source and one target connection, so database load grows roughly with the worker count. Going from 2 to 4 typically adds 15-20%; beyond that it mostly adds load. The effective value is also capped by the connection pool.
option.cdcIdlePoll=CDC idle poll interval (ms)
option.cdcIdlePollHelp=Dwell in milliseconds between mining cycles when the LogMiner / PostgreSQL logical slot / SQL Server CDC engine finds no new changes. When changes are drained the next cycle starts immediately without waiting. Leave empty for engine defaults (Oracle 1000 / PostgreSQL 500 / SQL Server 1000); lower means lower latency but heavier source mining load, floor 50 ms. Push-based MySQL binlog is unaffected.
error.project.cdc.idle.poll.too.small=CDC idle poll interval must be at least 50 ms; leave empty for engine defaults.
