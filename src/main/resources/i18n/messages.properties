project.startHelp=Once enabled, sync runs on schedule: each polling round applies only the changes after the cursor (log CDC consumes continuously) — not a full compare per round; full loads happen only on first start or rebaseline.
project.syncNowHelp=Runs one extra round on demand without changing the enabled state; resumes from the last successfully synced position instead of reloading everything. A click while a cycle is running is not dropped: one extra cycle runs automatically when the current one finishes.
