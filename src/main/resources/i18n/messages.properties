project.strategy.title=Capture strategy
project.strategy.polling.name=Polling
project.strategy.polling.desc=Polls incremental changes by timestamp/auto-increment; works with every database
project.strategy.fullcompare.name=Full compare
project.strategy.fullcompare.desc=Re-reads the whole table each interval and catches updates; needs a primary key; deletes need row deletion enabled and a table within the row cap. Heavy source load.
project.fullcompare.load.title=Full-compare load warning
project.fullcompare.load.body=The current poll interval is {0} ms. These tables are read and written in full on that interval:
project.fullcompare.load.overCap={0} (~{1} rows, over the {2}-row limit; interval should be at least {3} s)
project.fullcompare.load.overCapNoInterval={0} (~{1} rows, over the {2}-row limit; the current interval is already long enough)
project.fullcompare.load.heavy={0} (~{1} rows; interval should be at least {2} s)
project.fullcompare.load.hint=Unless that load is intended, use Incremental polling or Log CDC, or raise this task's poll interval to the suggested value. Suggestions assume about 1,000 rows/s for the full read and write; actual database performance decides.

project.pipe.title=The target reads “||” as logical OR
project.pipe.body=These views and routines use the source's “||” string concatenation. MySQL-family targets (GoldenDB, TDSQL, PolarDB, …) parse it as logical OR by default: the object is created successfully but returns 0/1 instead of the joined text. Supply a DDL override using CONCAT / CONCAT_WS in Conversion Review:
project.pipe.open=Open Conversion Review
