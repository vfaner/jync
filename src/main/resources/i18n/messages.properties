settings.os=Operating system
settings.startedAt=Started at
settings.scheduledProjects=Scheduled sync tasks
settings.syncDefaults=Synchronization defaults
settings.pollInterval=Default poll interval
settings.batchSize=Incremental / CDC batch size
settings.fetchSize=Incremental / CDC fetch size
settings.maxRetries=Failures before a task is marked ERROR
settings.safetyLag=Timestamp safety margin
settings.safetyLagHelp=The persisted watermark is rewound by this much so a source transaction that commits out of clock order is re-read rather than skipped.
settings.fullCompareMax=Full-comparison row ceiling
settings.deleteCompareMax=Chunked deletion-comparison ceiling
settings.deleteCompareMaxHelp=Above the full-comparison ceiling a table is compared one page of primary keys at a time instead of being skipped, up to this many rows. 0 disables it. Every cycle scans the whole target table once more, and a table whose primary key is rewritten by a column rule stays in-memory only.
settings.changeLogRetention=Change-log retention (days)
settings.changeLogRetentionHelp=Entries older than this are pruned hourly; 0 or less keeps them forever.
settings.lockTtl=Sync lock lease
settings.lockTtlHelp=How long a lock is held before a crashed instance's lease can be reclaimed.
settings.fullLoad=Full-load performance
settings.fullLoadBatch=Full-load batch size
settings.fullLoadBatchHelp=Rows per JDBC batch during the initial full load. Larger batches commit less often and load faster, at the cost of bigger transactions; incremental polling and CDC replay are unaffected. A sync task can override it.
settings.fullLoadFetch=Full-load fetch size
settings.fullLoadFetchHelp=Rows fetched per cursor read during the initial full load. Lower it if the source or the JVM is memory-constrained.
settings.fullLoadParallelism=Full-load parallelism
settings.fullLoadParallelismHelp=Worker threads for one chunked full load. Tables split on an integer leading key arithmetically and every other key shape on sampled key boundaries; the effective value is also capped by the connection pool. A sync task can override it.
settings.chunkSize=Chunk size
settings.chunkSizeHelp=Rows per keyset chunk of an initial full load. Each chunk commits and checkpoints on its own, so an interrupted load resumes from the last committed chunk. 0 disables chunking.
settings.deferSecondaryIndexes=Defer secondary indexes
settings.deferSecondaryIndexesHelp=Build non-unique secondary indexes after the initial load instead of maintaining them row by row. The primary key and unique indexes are always created immediately.
settings.insertFirst=Insert-first initial load
settings.insertFirstHelp=An initial load into an empty Oracle, MySQL or PostgreSQL target writes INSERT instead of the upsert; a table that already has rows keeps the idempotent upsert. Other target types are unaffected.
settings.on=On
settings.off=Off
settings.diagnostics=Diagnostics bundle
settings.diagnosticsHint=One zip for support
settings.diagnosticsNote=Downloads a zip with the application version, configuration shape, sync progress, recent change and audit history, and the tail of the log. Passwords, encrypted payloads, connection URLs with embedded credentials, cursor values and CDC layout signatures are excluded, and free text is redacted; still treat the archive as sensitive.
settings.diagnosticsDownload=Download bundle
settings.maxPoolSize=Pool size per database
settings.maxPoolSizeHelp=Maximum connections in each per-database pool. Parallel full-load workers borrow connections from it, so the effective parallelism is also bounded by this value.
settings.rowCountAudit=Row-count audit interval
settings.rowCountRepairMaxRows=Row-count repair ceiling
settings.rowCountRepairMaxRowsHelp=Largest shortfall the audit patches by key before clearing the cursor and reloading the table. 0 disables targeted repair.
settings.rowCountAuditHelp=Shortest gap between two COUNT(*) audits of the same table. 0 disables the audit.
settings.queryTimeout=Data query timeout
settings.queryTimeoutHelp=Maximum runtime of a data-plane statement before the driver aborts it. 0 disables the timeout.
settings.copyTimeout=Row copy timeout
settings.copyTimeoutHelp=Maximum runtime of the row copy itself (the window SELECT and the high-watermark MAX). It scales with the table, so it is separate from the statement timeout above; aborts there also retire the pooled connection. 0 disables the limit.
settings.maxUnindexedScanRows=Unindexed scan ceiling
settings.maxUnindexedScanRowsHelp=Above this row count, the bookkeeping COUNT(*) probes (NULL-cursor check and row-count audit) stop running when no index leads with the cursor column, because each would scan the whole table every cycle; the run also warns once per such table that the cursor column should be indexed. 0 keeps every probe running and turns the warning off.
settings.metadataTimeout=Metadata query timeout
settings.metadataTimeoutHelp=Statement timeout for schema enumeration queries.
settings.shutdownWait=Shutdown wait
settings.shutdownWaitHelp=How long in-flight sync cycles may finish during shutdown; cycles still running afterwards are abandoned and their open batches rolled back. 0 skips the wait.
settings.reconcileInterval=Schedule reconcile interval
settings.reconcileIntervalHelp=How often each node aligns its local Quartz schedule with the enabled flag in the shared database. Only relevant to multi-instance deployments.
settings.cdc=CDC engine parameters
settings.cdcNote=Internal tuning for the CDC consumers. The defaults suit most deployments; change them only when diagnosing reconnects or replication lag.
settings.cdcReconnectMax=Reconnect backoff ceiling
settings.cdcReconnectMaxHelp=Upper bound of the exponential backoff after a dropped CDC stream.
settings.cdcSupervise=Consumer supervise interval
settings.cdcSuperviseHelp=How often the supervisor retries acquiring the CDC lease for sync tasks that want CDC.
settings.cdcChangeWindow=Aggregated change window
settings.cdcChangeWindowHelp=CDC rows are aggregated into one change-log entry per table per window; 0 disables aggregated logging.
settings.cdcLogminerBatch=LogMiner batch size
settings.cdcLogminerBatchHelp=Rows fetched per V$LOGMNR_CONTENTS batch.
settings.cdcPgBatch=PostgreSQL logical batch size
settings.cdcPgBatchHelp=Rows fetched per pg_logical_slot_get_changes batch.
settings.cdcMssqlBatch=SQL Server CDC batch size
settings.cdcMssqlBatchHelp=Rows fetched per cdc.fn_cdc_get_all_changes batch.
settings.lob=Large objects and streaming
settings.lobNote=Large text and binary values are no longer read whole into the heap: small values stay inline, large ones stream, and oversized values inside a CDC transaction spill to disk first. The defaults suit most deployments; adjust them only when heap or temp space is tight.
settings.lobStreaming=Streaming reads and writes
settings.lobStreamingHelp=Master switch for large-field streaming. Turned off, every LOB is read whole as in 1.7.7, and a table with millions of large values can exhaust the heap on the source side.
settings.lobInline=In-memory inline threshold
settings.lobInlineHelp=Values up to this many bytes stay in memory. Raising it means fewer temp files but more heap held per batch.
settings.lobCdcSpill=CDC spill threshold
settings.lobCdcSpillHelp=A single value above this many bytes is written to the spill directory while the CDC transaction is buffered, and deleted once it commits or rolls back.
settings.lobBatchBudget=Per-batch byte budget
settings.lobBatchBudgetHelp=Approximate byte ceiling for one JDBC batch; reaching it commits early. A single value larger than the budget gets a batch of its own. 0 disables the check.
settings.lobSourceStreaming=Source-side streaming reads
settings.lobSourceStreamingHelp=PostgreSQL/openGauss sources hold a read-only transaction for the duration of the read; without it the driver buffers the whole result set. The cost is that the source's vacuum is held off while the read runs.
settings.lobSpillDir=Spill directory
settings.lobSpillDirHelp=Temp-file directory, created on demand. Only files with this tool's prefix are ever cleaned up; nothing else in the directory is touched.
settings.lobSpillMax=Spill capacity ceiling
settings.lobSpillMaxHelp=Most disk one CDC session may use; exceeding it fails with an error naming this setting. 0 means unlimited.
settings.lobRetention=Spill cleanup retention
settings.lobRetentionHelp=At startup, leftover temp files older than this are deleted (this tool's prefix only), reclaiming whatever an abnormal exit left behind.
settings.lobMissingLobPolicy=LogMiner missing-LOB policy
settings.lobMissingLobPolicyHelp=Out-of-line Oracle LOBs cannot be reconstructed from redo. skip: count, warn and continue; fail: park at the first such change without advancing the position. Both count it, visible on the CDC status panel.
settings.lobOn=on
settings.lobOff=off
settings.supportedDatabases=Supported databases
settings.configNote=These values come from application.yml and are read-only here. Edit the file and restart to change them.
settings.concurrency=Concurrency and recovery
settings.concurrencyNote=Only one sync runs per sync task at a time, enforced at three levels: the Quartz job forbids overlapping fires, a JVM lock covers manual runs in the same process, and a database lease with an expiry covers other processes while still allowing a crashed owner's lock to be reclaimed. Each table's cursor advances only after its rows are committed to the target, so a crash replays the last window rather than skipping it; because every write is an upsert keyed on the primary key, the replay is harmless.
