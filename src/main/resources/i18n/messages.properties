conversion.limitsTitle=What a passing check does not prove
conversion.limitsBody=A successful syntax check means the target accepted the DDL. It does not mean the routine behaves the same. Cursor semantics, implicit transaction boundaries, exception handling such as NO_DATA_FOUND, NULL concatenation, integer division and the row order of an unordered query all differ between products and none of them are exercised by a CREATE. Verify behaviour with your own data before relying on it.
