option.syncProcedures=Procedures and functions
option.syncProceduresHelp=Translate routine bodies. Complex procedural code may need a manual override.
option.allowDrop=Apply drops
option.allowDropHelp=Remove target objects when they disappear from the source. Off by default because a drop cannot be undone.
option.syncDeletes=Propagate row deletions
option.syncDeletesHelp=Compare primary keys and delete target rows missing from the source. Only applied to small tables.
option.disableConstraints=Suspend target foreign keys during load
option.disableConstraintsHelp=Avoids ordering failures while rows are being written.
option.truncateBeforeInitialLoad=Empty target table before the first load
option.truncateBeforeInitialLoadHelp=Use when the target may hold stale rows from an earlier run.
option.pollInterval=Poll interval (ms)
option.pollIntervalHelp=Leave blank to use the global default.
option.cronExpression=Cron expression
option.cronExpressionHelp=Overrides the poll interval when set. Quartz syntax (6 or 7 fields, seconds first). Takes effect after the project is started, in the server's time zone.
option.batchSize=Batch size
option.batchSizeHelp=Rows per JDBC batch of the initial full load. Leave blank for the global default ({0}). Bigger batches mean fewer commits and a faster load, but a larger single transaction; incremental polling and CDC replay are unaffected.
option.batchSizeTip=Recommended 1000-5000 (default {0}). Bigger batches commit less often and load faster, but each transaction grows with them: slower rollback, more undo/redo and driver memory, and gains flatten out beyond 5000. Use 1000-2000 when the target database is under load.

