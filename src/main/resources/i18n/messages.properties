cursor.help=A cursor column lets the tool read only what changed. A last-modified timestamp detects inserts and updates; a numeric key detects inserts only.
cursor.TIMESTAMP=Timestamp
cursor.ROW_SCN=Row SCN
cursor.IDENTITY=Numeric key
cursor.FULL_COMPARE=Full comparison
cursor.NONE=None
cursor.strategy.TIMESTAMP.help=Detects inserts and updates.
cursor.strategy.ROW_SCN.help=Oracle row-level ORA_ROWSCN (table created WITH ROWDEPENDENCIES). Detects inserts and updates, not deletes; reading MAX(ORA_ROWSCN) each cycle is a full scan.
cursor.strategy.IDENTITY.help=Detects inserts only; updates to existing rows are not seen.
cursor.strategy.FULL_COMPARE.help=Re-reads the whole table each cycle.
cursor.strategy.NONE.help=No incremental strategy available. Set a cursor column to enable sync.

