project.controls=Controls
project.start=Enable auto-sync
project.stop=Stop sync
project.syncNow=Run one round
project.reset=Reset progress
project.resetHelp=Clears all cursors and snapshots so the next run reloads everything. Stop the sync task first.
project.startHelp=Once enabled, sync runs on schedule: each polling round applies only the changes after the cursor (log CDC consumes continuously) — not a full compare per round; full loads happen only on first start or rebaseline.
project.syncNowHelp=Runs one extra round on demand without changing the enabled state; resumes from the last successfully synced position instead of reloading everything. A click while a cycle is running is not dropped: one extra cycle runs automatically when the current one finishes.
project.nextRun=Next run
project.nextRun.pending=Pending schedule registration
project.nextRun.notStarted=Not started (runs on schedule once started)
project.nextRun.executing=Previous round still running: last progress {0} min ago. No new round starts until it returns.
project.nextRun.stuck=Possibly wedged: no progress for {0} min, so this instance will not start another round. Force-unlock does not help — the schedule stays frozen until that cycle returns or the instance restarts.
project.nextRun.overdue=This time has passed: the previous round may still be running, so this one was skipped. If no new round starts, restart the instance.
