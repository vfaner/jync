project.strategy.sqlserver.name=SQL Server change-table CDC
project.strategy.sqlserver.desc=Reads SQL Server change tables in near real time, including deletes
project.strategy.ystream.name=YashanDB YStream CDC
project.strategy.ystream.desc=Replays the YashanDB YStream logical log in near real time, including deletes; no triggers, no table changes. Each YashanDB instance supports at most 32 YStream services, one per task; the source needs archiving plus a one-time supplemental-log DDL per table (run by your DBA); a task may run on only one Jync instance at a time
