settings.concurrency=并发与故障恢复
settings.concurrencyNote=同一项目同时只允许一个同步任务运行，由三层机制保证：Quartz 任务禁止并发触发；JVM 锁覆盖同进程内的手动执行；带过期时间的数据库租约覆盖其他进程，同时允许接管崩溃实例遗留的锁。每张表的游标只在数据成功提交到目标库之后才推进，因此崩溃后会重放上一个窗口而不会跳过数据；由于所有写入都是基于主键的 upsert，重放不会产生重复数据。

