project.start=开启自动同步
project.stop=停止同步
project.syncNow=手动跑一轮
project.reset=重置进度
project.resetHelp=清除所有游标和快照，下次运行将全量重载。请先停止同步任务。
project.startHelp=启用后按调度自动运行：轮询每轮只同步游标之后的增量（日志 CDC 为持续消费），并非逐轮全量；全量加载仅发生在首次启动或重建基线。
project.syncNowHelp=不改启用状态，手动补跑一轮：从上次成功同步的位置继续，不会全量重载；运行中的点击不会丢弃，本轮结束后自动补跑一轮。
project.nextRun=下次自动运行
project.nextRun.pending=等待调度注册
project.nextRun.notStarted=未启动（启动后才会按调度运行）
project.nextRun.executing=上一轮仍在执行：最近一次进度在 {0} 分钟前，这一轮返回前不会触发下一轮。
project.nextRun.stuck=疑似卡死：已 {0} 分钟无进展，本实例不会再触发下一轮。强制解锁无效，需等这一轮返回或重启本实例。
project.nextRun.overdue=该时间已过：上一轮可能仍未返回，因此这一轮被跳过；若一直没有新的一轮，请重启本实例。
project.lock=同步锁
project.lock.held=持有中
project.lock.expired=已过期
project.lock.stale=上一轮残留（已过期）
project.lock.staleHelp=这是上一轮留下的租约，已过期且本实例没有在跑的轮次：不阻塞调度，下一轮取锁时会直接接管，无需处理。
project.lock.until=租约至
project.lock.forceUnlock=强制解锁
project.confirm.forceUnlock=确定要强制解除“{0}”持有的同步锁吗？若持有者仍在运行，它会在下一次续约时中止本轮；仅在持有者卡死或已消失时使用。
