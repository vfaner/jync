option.syncStructure=表结构
option.syncStructureHelp=在目标库创建和修改表，使其与源库一致。
option.syncData=表数据
option.syncDataHelp=通过游标列增量复制数据行。
option.syncIndexes=索引
option.syncIndexesHelp=创建与重建二级索引。
option.syncViews=视图
option.syncViewsHelp=转换并应用视图定义。
option.syncProcedures=存储过程与函数
option.syncProceduresHelp=转换过程体。复杂的过程化代码可能需要手动指定 DDL。
option.allowDrop=允许执行删除
option.allowDropHelp=源库对象消失时删除目标对象，包括整表删除。仅在源库账户能看见整个 schema（表属主、库级 SELECT 或 SELECT ANY TABLE）时生效；单表授权的账户上，删表与授权收回无法区分，会保留目标对象。目标表仍被外键引用时会失败并重试。默认关闭，因为删除无法撤销。
option.syncDeletes=同步行删除
option.syncDeletesHelp=比对主键并删除源库中已不存在的目标行。仅对小表生效。日志 CDC 下只在基线加载完成后执行一次，之后的删除由日志流自身同步。
option.disableConstraints=写入期间暂停目标外键约束
option.disableConstraintsHelp=避免写入顺序导致的约束失败。
option.truncateBeforeInitialLoad=首次加载前清空目标表
option.truncateBeforeInitialLoadHelp=当目标表可能残留旧数据时使用。
option.pollInterval=轮询间隔（毫秒）
option.pollIntervalHelp=留空则使用全局默认值。
option.cronExpression=Cron 表达式
option.cronExpressionHelp=填写后优先于轮询间隔，使用 Quartz 语法（6 或 7 段，秒在最前）。同步任务启动后才生效，且按服务器时区计算。
option.batchSize=批量大小
option.batchSizeHelp=首次全量加载每个 JDBC 批次的行数，留空使用全局默认值（{0}）。批次越大提交越少、加载越快，但单次事务也越大；增量轮询与 CDC 回放不受此项影响。
option.batchSizeTip=建议 1000-5000（默认 {0}）。批次越大提交越少、加载越快，但单次事务也随之变大：回滚更慢，undo/redo 与驱动内存占用更高，超过 5000 后提速基本消失。目标库负载敏感时用 1000-2000。

