cursor.strategy.TIMESTAMP.help=可识别新增和更新。
cursor.strategy.ROW_SCN.help=Oracle 行级 ORA_ROWSCN（建表时带 ROWDEPENDENCIES）。可识别新增和更新，识别不了删除；每轮取 MAX(ORA_ROWSCN) 是一次全表扫描。
cursor.strategy.IDENTITY.help=仅识别新增，已有行的更新无法感知。
cursor.strategy.FULL_COMPARE.help=每个周期重新读取整张表。
cursor.strategy.NONE.help=无可用增量策略，请设置游标列以启用同步。

