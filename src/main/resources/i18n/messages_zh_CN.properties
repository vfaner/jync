project.config.lockedWhileRunning=同步任务正在运行。请先「停止同步」再修改捕获策略、同步对象或调度——运行中修改要到下次启动才生效，且没有即时反馈。
project.saveConfig=保存配置
option.customSchedule=自定义调度
option.customScheduleHelp=开启后自定义轮询间隔 / Cron；关闭则使用全局默认值
option.fullLoadParallelism=并行度
option.fullLoadParallelismHelp=首次全量加载时并行的分片数（1=顺序加载）。有主键的表都可并行：整数前导主键按区间算术切分，其余键形态按采样边界切分；无主键表顺序加载。实际值受连接池上限约束；数据库敏感时设为 1。留空使用全局默认值（{0}）。
option.fullLoadParallelismTip=建议 1-4（默认 {0}）。每个 worker 同时占用 1 条源连接和 1 条目标连接，数据库负载大致与并行度成正比；2→4 通常再快 15-20%，再往上主要是加压。实际生效值还受连接池上限约束。
option.fullLoadParallelismCap=连接池 {0} 条，实际最多 {1} 个。
option.cdcIdlePoll=CDC 空闲轮询间隔（毫秒）
option.cdcIdlePollHelp=没有新变更时，LogMiner / PostgreSQL 逻辑复制 / SQL Server CDC 引擎两次挖掘之间的休眠毫秒数。捞到变更时会立即连续挖掘、不等待。留空使用引擎默认（Oracle 1000 / PostgreSQL 500 / SQL Server 1000）；调小延迟更低但源库挖掘负载更高，最低 50 毫秒。MySQL binlog 为服务端推送模式，不受此项影响。
error.project.cdc.idle.poll.too.small=CDC 空闲轮询间隔不得低于 50 毫秒；留空表示使用引擎默认值。
