project.syncOptions.cdcHidden=日志 CDC 模式下，表结构与表数据在基线全量加载时始终开启（已隐藏，不可关闭）；索引按上方保存的开关执行，可随时调整；视图、存储过程以及在基线才生效的选项都收在下方「基线全量加载」分组里，默认收起，展开即可调整。切回「增量轮询」或「全量比对」可恢复显示全部开关。
