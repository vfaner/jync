project.strategy.title=捕获策略
project.strategy.polling.name=增量轮询
project.strategy.polling.desc=按时间戳/自增列轮询增量,兼容所有数据库
project.strategy.fullcompare.name=全量比对
project.strategy.fullcompare.desc=每周期重读整表，可发现 UPDATE；需主键，删除需开启「同步行删除」且行数未超限，源库压力大
project.fullcompare.load.title=全量比对负载提示
project.fullcompare.load.body=当前轮询间隔 {0} 毫秒。以下表会按该间隔重复整表读取与写入：
project.fullcompare.load.overCap={0}（约 {1} 行，超过上限 {2} 行；建议间隔 ≥ {3} 秒）
project.fullcompare.load.overCapNoInterval={0}（约 {1} 行，超过上限 {2} 行；当前间隔已足够长）
project.fullcompare.load.heavy={0}（约 {1} 行；建议间隔 ≥ {2} 秒）
project.fullcompare.load.hint=如非必要，建议改用「增量轮询」或「日志 CDC」，或把该任务的轮询间隔调到建议值以上。建议间隔按约 1,000 行/秒的整表读写速度估算，实际以数据库性能为准。
project.strategy.cdc.name=MySQL binlog CDC
project.strategy.cdc.desc=解析 MySQL binlog 实时回放 INSERT/UPDATE/DELETE,秒级延迟
