settings.startedAt=启动时间
settings.scheduledProjects=已调度同步任务
settings.syncDefaults=同步默认值
settings.pollInterval=默认轮询间隔
settings.batchSize=增量 / CDC 批量大小
settings.fetchSize=增量 / CDC 读取批量
settings.maxRetries=连续失败多少次后标记为异常
settings.safetyLag=时间戳安全回退量
settings.safetyLagHelp=持久化的水位线会回退这一时长，使提交顺序晚于时间戳的源库事务能被重新读取，而不会被跳过。
settings.fullCompareMax=全表比对行数上限
settings.deleteCompareMax=分块删除比对行数上限
settings.deleteCompareMaxHelp=超过全表比对上限的表不再直接跳过，而是按主键分页比对，最多到这么多行；0 表示关闭。每个周期会多扫一遍目标全表，主键被列清洗规则改写的表仍只用内存比对。
settings.changeLogRetention=变更日志保留天数
settings.changeLogRetentionHelp=超过该天数的变更日志每小时清理一次；小于等于 0 表示永久保留。
settings.lockTtl=同步锁租约时长
settings.lockTtlHelp=锁的持有时长；超过后崩溃实例持有的锁可被其他实例接管。
settings.fullLoad=全量加载性能
settings.fullLoadBatch=全量批次大小
settings.fullLoadBatchHelp=首次全量加载每个 JDBC 批次的行数。批次越大提交越少、加载越快，但单次事务也越大；增量轮询与 CDC 回放不受影响。同步任务详情页可单独覆盖。
settings.fullLoadFetch=全量读取批量
settings.fullLoadFetchHelp=首次全量加载每次游标读取的行数。源库或 JVM 内存紧张时调小。
settings.fullLoadParallelism=全量并行度
settings.fullLoadParallelismHelp=单次分块全量的 worker 线程数。整数前导主键按区间算术切分，其他键形态按采样边界切分；实际值还受连接池上限约束。同步任务详情页可单独覆盖。
settings.chunkSize=分块行数
settings.chunkSizeHelp=首次全量每个键区间分块的行数。每块单独提交并记录断点，中断后从最后提交的块继续；0 表示关闭分块。
settings.deferSecondaryIndexes=延迟创建二级索引
settings.deferSecondaryIndexesHelp=首次全量完成后再创建非唯一二级索引，而不是边写边维护。主键与唯一索引始终立即创建。
settings.insertFirst=空表全量用 INSERT
settings.insertFirstHelp=目标为空的 Oracle / MySQL / PostgreSQL 表首次全量时，用 INSERT 代替 MERGE / ON DUPLICATE KEY UPDATE / ON CONFLICT；已有数据的表仍用幂等 upsert。其他目标库不受影响。
settings.on=开启
settings.off=关闭
settings.maxPoolSize=每库连接池上限
settings.maxPoolSizeHelp=每个数据库连接池的最大连接数。并行全量的 worker 也从中借用连接，因此并行度实际受此值约束。
settings.rowCountAudit=行数审计间隔
settings.rowCountRepairMaxRows=按主键修补的缺口上限
settings.rowCountRepairMaxRowsHelp=审计发现目标少行且缺口不超过该值时，按主键定位并单独补齐，游标不动；0 表示关闭，退回清空游标整表重载。
settings.rowCountAuditHelp=同一张表两次 COUNT(*) 审计之间的最短间隔；0 表示关闭审计。
settings.queryTimeout=数据查询超时
settings.queryTimeoutHelp=数据面语句的最长执行时间，超时后由驱动中止；0 表示不限制。
settings.metadataTimeout=元数据查询超时
settings.metadataTimeoutHelp=表、视图、索引等元数据枚举语句的超时时间。
settings.shutdownWait=停机等待时长
settings.shutdownWaitHelp=停机时允许进行中的同步周期完成的最长时间；超时后放弃这些周期并回滚未提交批次。0 表示不等待。
settings.reconcileInterval=调度对账间隔
settings.reconcileIntervalHelp=每个节点把本地 Quartz 调度与共享库里的启用标志对齐的间隔。仅多实例部署时需要关注。
settings.cdc=CDC 引擎参数
settings.cdcNote=CDC 消费者的内部调优参数。默认值适合大多数部署，仅在排查重连或复制延迟时调整。
settings.cdcReconnectMax=重连退避上限
settings.cdcReconnectMaxHelp=CDC 流断开后指数退避重连的最长间隔。
settings.cdcSupervise=消费者监督间隔
settings.cdcSuperviseHelp=监督线程为待启动的同步任务重试获取 CDC 租约的间隔。
settings.cdcChangeWindow=变更聚合窗口
settings.cdcChangeWindowHelp=CDC 行变更按表聚合成一条变更日志的时间窗口；0 表示关闭聚合日志。
settings.cdcLogminerBatch=LogMiner 批次
settings.cdcLogminerBatchHelp=每次从 V$LOGMNR_CONTENTS 读取的行数。
settings.cdcPgBatch=PostgreSQL 逻辑复制批次
settings.cdcPgBatchHelp=每次从 pg_logical_slot_get_changes 读取的行数。
settings.cdcMssqlBatch=SQL Server CDC 批次
settings.cdcMssqlBatchHelp=每次从 cdc.fn_cdc_get_all_changes 读取的行数。
settings.lob=大字段与流式
settings.lobNote=大文本与大二进制不再整块读入堆内存：小值内联，大值流式读写，CDC 事务中的超大值先落盘。默认值适合大多数部署，仅在内存或临时文件空间紧张时调整。
settings.lobStreaming=流式读写
settings.lobStreamingHelp=大字段流式处理总开关。关闭后所有 LOB 都按 1.7.7 的方式整块读取，源库上百万行的大字段表可能耗尽堆内存。
settings.lobInline=内存内联阈值
settings.lobInlineHelp=不超过该字节数的值直接放在内存中。调大可以减少临时文件，但会抬高每批次的内存占用。
settings.lobCdcSpill=CDC 落盘阈值
settings.lobCdcSpillHelp=CDC 事务缓冲中单个值超过该字节数时先写入落盘目录，提交或回滚后删除。
settings.lobBatchBudget=单批字节预算
settings.lobBatchBudgetHelp=一个 JDBC 批次累计的近似字节数上限，达到即先提交。单个值超过预算时独占一批。0 表示不检查。
settings.lobSourceStreaming=源端流式读取
settings.lobSourceStreamingHelp=PostgreSQL/openGauss 源库在读取期间保持一个只读事务，否则驱动会一次性缓冲整个结果集。代价是读取期间源库的清理（vacuum）会被推迟。
settings.lobSpillDir=落盘目录
settings.lobSpillDirHelp=临时文件目录，按需创建；只清理本工具前缀的文件，不会动目录中的其他内容。
settings.lobSpillMax=落盘容量上限
settings.lobSpillMaxHelp=单个 CDC 会话最多可占用的磁盘空间，超出后报错并明确指明该配置项。0 表示不限制。
settings.lobRetention=清理保留期
settings.lobRetentionHelp=应用启动时删除超过该时长的遗留临时文件（仅本次工具前缀），用于回收异常退出后的残留。
settings.lobMissingLobPolicy=LogMiner 缺失 LOB 策略
settings.lobMissingLobPolicyHelp=Oracle 行外 LOB 无法从 redo 还原。skip：计数并告警后继续；fail：停在第一条此类变更处且不推进位点。两种取值都会计数，可在 CDC 状态面板查看。
settings.lobOn=开启
settings.lobOff=关闭
settings.supportedDatabases=支持的数据库
settings.configNote=以上取值来自 application.yml，此处仅供查看。修改需编辑该文件并重启。
settings.concurrency=并发与故障恢复
settings.concurrencyNote=同一条同步任务同时只允许一个运行实例，由三层机制保证：Quartz 任务禁止并发触发；JVM 锁覆盖同进程内的手动执行；带过期时间的数据库租约覆盖其他进程，同时允许接管崩溃实例遗留的锁。每张表的游标只在数据成功提交到目标库之后才推进，因此崩溃后会重放上一个窗口而不会跳过数据；由于所有写入都是基于主键的 upsert，重放不会产生重复数据。
