project.strategy.pg.name=PostgreSQL 逻辑解码 CDC
project.strategy.pg.desc=通过 JDBC 轮询 PostgreSQL 逻辑复制槽(test_decoding),实时回放变更,秒级延迟
project.strategy.sqlserver.name=SQL Server 变更表 CDC
project.strategy.sqlserver.desc=读取 SQL Server 变更表,实时回放 INSERT/UPDATE/DELETE,秒级延迟
project.strategy.ystream.name=崖山 YStream CDC
project.strategy.ystream.desc=通过崖山 YStream 逻辑日志实时回放 INSERT/UPDATE/DELETE,不建触发器、不改表结构,秒级延迟。每个崖山实例最多 32 个 YStream 服务,每个任务占 1 个;源端需开归档并为每张表加一次补充日志(由 DBA 一次性执行);同一任务只能在一个 Jync 实例上运行
