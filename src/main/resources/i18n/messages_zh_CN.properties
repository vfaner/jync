settings.lockTtl=同步锁租约时长
settings.lockTtlHelp=锁的持有时长；超过后崩溃实例持有的锁可被其他实例接管。
settings.fullLoad=全量加载性能
settings.fullLoadBatch=全量批次大小
settings.fullLoadBatchHelp=首次全量加载每个 JDBC 批次的行数。批次越大提交越少、加载越快，但单次事务也越大；增量轮询与 CDC 回放不受影响。同步任务详情页可单独覆盖。
settings.fullLoadFetch=全量读取批量
settings.fullLoadFetchHelp=首次全量加载每次游标读取的行数。源库或 JVM 内存紧张时调小。
settings.fullLoadParallelism=全量并行度
settings.fullLoadParallelismHelp=单次分块全量的 worker 线程数。整数前导主键按区间算术切分，其他键形态按采样边界切分；实际值还受连接池上限约束。同步任务详情页可单独覆盖。
settings.chunkSize=分块行数
settings.chunkSizeHelp=首次全量每个键区间分块的行数。每块单独提交并记录断点，中断后从最后提交的块继续；0 表示关闭分块。
settings.deferSecondaryIndexes=延迟创建二级索引
settings.deferSecondaryIndexesHelp=首次全量完成后再创建非唯一二级索引，而不是边写边维护。主键与唯一索引始终立即创建。
settings.insertFirst=空表全量用 INSERT
settings.insertFirstHelp=目标为空的 Oracle / MySQL / PostgreSQL 表首次全量时，用 INSERT 代替 MERGE / ON DUPLICATE KEY UPDATE / ON CONFLICT；已有数据的表仍用幂等 upsert。其他目标库不受影响。
