<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::scripts}, 'projects', 'project.detail')}">
<body>
<th:block th:fragment="content" th:remove="tag">
<div th:remove="tag">

    <!--/* 任务详情页只做装配：每张卡一个模块文件（project-detail/）。
           共享卡片（页头、控制、策略、对象、选项、性能、列清洗、进度）所有模式都用；
           轮询专属（调度、结构/数据/索引开关）与 CDC 专属（状态面板、基线分组、
           空闲轮询、调度占位说明）分别在自己的文件里。改哪张卡就只动那个文件，
           一种模式的改动不会牵动另一种模式。装配顺序即页面顺序。 */-->
    <th:block th:replace="~{project-detail/head :: head}"/>
    <th:block th:replace="~{project-detail/controls :: card}"/>
    <th:block th:replace="~{project-detail/cdc-status :: cdc-card}"/>

    <!--/* data-original-strategy：已保存的捕获策略，B8 确认框拿它和提交值比对，
           只有「改成任一日志 CDC」才弹确认（app.js isLogCdcStrategy，与后端
           CaptureStrategy.isLogCdc() 同口径，含 PG 逻辑复制 / SQL Server CDC）。
           注意不能用 selectedStrategy：就绪探测推荐 CDC 时那个勾选只是建议、并未
           落库，拿它当基线会让表单看起来「干净」，点启动便静默按轮询跑。app.js
           加载时会比较勾选值与这里的已保存值，不一致即视为未保存修改。 */-->
    <form id="config-form" method="post" th:action="@{/projects/{id}/config(id=${project.id})}"
          th:attr="data-original-strategy=${storedStrategy},
                   data-cdc-active=${cdcActive}">
    <!--/* 访客保留这一整块而不是藏掉：勾选状态本身是有用的只读信息。
           fieldset[disabled] 让浏览器原生置灰全部输入，比逐个加 disabled 可靠，
           也顺带保证浏览器不会把这些字段提交上去。
           另外：项目运行中(enabled=true)也禁用整张表单——改策略/改表/改调度必须
           先停止项目，否则改动要到下次启动才生效，运行中改完还看不到任何反馈。 */-->
    <fieldset class="bare" th:attr="disabled=${(isAdmin and !project.enabled)} ? null : 'disabled'">
        <!-- 运行中锁定提示：仅管理员 + 运行中时展示，告诉用户为什么表单是灰的。 -->
        <div class="card" th:if="${isAdmin and project.enabled}"
             style="margin-top:18px;border-left:3px solid var(--warn)">
            <div class="card-body">
                <div class="help" style="margin:0">
                    <svg class="ico" style="color:var(--warn);vertical-align:-3px;margin-right:4px"><use href="#exclamation-triangle-fill"/></svg>
                    <span th:text="#{project.config.lockedWhileRunning}">Project is running. Stop it first to change capture strategy, table selection, or schedule.</span>
                </div>
            </div>
        </div>
        <!--/* 捕获策略与「同步对象」同宽、与「同步选项」同一行：三张卡原来各占一行，
             策略卡独占整行却只用掉半屏高度，下面全是空白。现在左列放策略卡和同步
             对象，右列从「同步选项」往下接调度与加载性能——两列各自连续排列，列内
             不会留空；窄屏（≤1100px）叠回单列时顺序仍是策略 → 对象 → 选项 → 调度。 */-->
        <div class="split-wide" style="margin-top:18px">
            <div>
                <th:block th:replace="~{project-detail/strategy :: card}"/>
                <th:block th:replace="~{project-detail/objects :: card}"/>
                <!--/* 数据库专属卡片插槽：某库有专属、别的库用不上的参数时，新增
                       project-detail/<库>.html（片段名 card），在这里加一行引用即可；
                       共用卡片与其它库都不受影响。当前没有这样的库，故留空。 */-->
            </div>
            <div>
                <th:block th:replace="~{project-detail/options :: card}"/>
                <th:block th:replace="~{project-detail/schedule :: card}"/>
                <th:block th:replace="~{project-detail/cdc-schedule-hint :: card}"/>
                <th:block th:replace="~{project-detail/performance :: card}"/>
                <th:block th:replace="~{project-detail/cdc-idle-poll :: card}"/>
            </div>
        </div>
    </fieldset>
    </form>

    <th:block th:replace="~{project-detail/column-rules :: card}"/>
    <th:block th:replace="~{project-detail/progress :: block}"/>
    <th:block th:replace="~{project-detail/precheck :: modal}"/>

</div>
</th:block>

<th:block th:fragment="scripts" th:remove="tag"></th:block>
</body>
</html>
