<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="block" th:remove="tag">
<div class="grid-2" th:if="${task.batchId == null}">
    <div class="field">
        <label for="sourceDbId">
            <svg class="ico"><use href="#box-arrow-up-right"/></svg>
            <span th:text="#{etl.source}">Source connection</span><span class="req">*</span>
        </label>
        <select class="select" id="sourceDbId" name="sourceDbId" required>
            <option value="" th:text="#{project.selectDatabase}">-- select --</option>
            <option th:each="db : ${connections}" th:value="${db.id}"
                    th:selected="${task.sourceDbId != null and db.id == task.sourceDbId}"
                    th:data-type="${db.type.name()}"
                    th:text="|${db.name} · #{${'db.type.' + db.type.name()}}|">db</option>
        </select>
        <div class="help" th:text="#{etl.source.readOnlyHint}">Read-only SQL interfaces can only be a source.</div>
    </div>
    <div class="field">
        <label for="targetDbId">
            <svg class="ico"><use href="#box-arrow-in-down-left"/></svg>
            <span th:text="#{etl.target}">Target connection</span><span class="req">*</span>
        </label>
        <select class="select" id="targetDbId" name="targetDbId" required>
            <option value="" th:text="#{project.selectDatabase}">-- select --</option>
            <option th:each="db : ${targetConnections}" th:value="${db.id}"
                    th:selected="${task.targetDbId != null and db.id == task.targetDbId}"
                    th:text="|${db.name} · #{${'db.type.' + db.type.name()}}|">db</option>
        </select>
    </div>
</div>

<!-- 成员：连接由批次锁定，只回传原值（服务端也拒绝改动）。 -->
<div class="grid-2" th:if="${task.batchId != null}">
    <input type="hidden" name="sourceDbId" th:value="${task.sourceDbId}">
    <input type="hidden" name="targetDbId" th:value="${task.targetDbId}">
    <div class="field">
        <label>
            <svg class="ico"><use href="#box-arrow-up-right"/></svg>
            <span th:text="#{etl.source}">Source connection</span>
        </label>
        <div class="input" th:text="${connectionNames.get(task.sourceDbId)} ?: '—'">—</div>
        <div class="help" th:text="#{etl.batch.lockedHint}">Source and target cannot change after the batch is created.</div>
    </div>
    <div class="field">
        <label>
            <svg class="ico"><use href="#box-arrow-in-down-left"/></svg>
            <span th:text="#{etl.target}">Target connection</span>
        </label>
        <div class="input" th:text="${connectionNames.get(task.targetDbId)} ?: '—'">—</div>
    </div>
</div>
</th:block>
</body>
</html>
