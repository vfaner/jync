<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::scripts}, 'account', 'account.title')}">
<body>
<th:block th:fragment="content" th:remove="tag">
<div th:remove="tag">

    <div class="page-head">
        <div>
            <h1 th:text="#{account.title}">Change password</h1>
            <p class="sub" th:text="#{account.hint}">
                You will be signed out and need to sign in again.
            </p>
        </div>
    </div>

    <div style="max-width:520px">

        <div class="alert alert-danger" th:if="${errorKey}">
            <svg class="ico"><use href="#x-circle-fill"/></svg>
            <div class="alert-body" th:text="#{${errorKey}}">Something was wrong.</div>
        </div>

        <form method="post" th:action="@{/account/password}">
            <div class="card">
                <div class="card-head">
                    <h2><svg class="ico"><use href="#shield-check"/></svg>
                        <span th:text="${currentUsername}">admin</span></h2>
                </div>
                <div class="card-body">

                    <div class="field">
                        <label for="currentPassword">
                            <span th:text="#{account.current}">Current password</span><span class="req">*</span>
                        </label>
                        <div class="login-pw">
                            <input type="password" class="input" id="currentPassword"
                                   name="currentPassword" required maxlength="128"
                                   autocomplete="current-password">
                            <button type="button" class="icon-btn login-pw-toggle"
                                    data-role="toggle-password" data-target="currentPassword"
                                    th:title="#{login.showPassword}">
                                <svg class="ico"><use href="#eye"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label for="newPassword">
                            <span th:text="#{account.new}">New password</span><span class="req">*</span>
                        </label>
                        <div class="login-pw">
                            <input type="password" class="input" id="newPassword"
                                   name="newPassword" required minlength="6" maxlength="128"
                                   autocomplete="new-password">
                            <button type="button" class="icon-btn login-pw-toggle"
                                    data-role="toggle-password" data-target="newPassword"
                                    th:title="#{login.showPassword}">
                                <svg class="ico"><use href="#eye"/></svg>
                            </button>
                        </div>
                        <div class="help" th:text="#{account.newHelp}">At least 6 characters.</div>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">
                            <span th:text="#{account.confirm}">Confirm new password</span><span class="req">*</span>
                        </label>
                        <input type="password" class="input" id="confirmPassword"
                               name="confirmPassword" required minlength="6" maxlength="128"
                               autocomplete="new-password">
                    </div>
                </div>
                <div class="card-foot" style="display:flex;gap:9px;flex-wrap:wrap">
                    <button type="submit" class="btn btn-primary">
                        <svg class="ico"><use href="#check-lg"/></svg>
                        <span th:text="#{account.submit}">Change password</span>
                    </button>
                    <a class="btn btn-ghost" th:href="@{/}" th:text="#{common.cancel}">Cancel</a>
                </div>
            </div>
        </form>
    </div>

</div>
</th:block>

<th:block th:fragment="scripts" th:remove="tag"></th:block>
</body>
</html>
