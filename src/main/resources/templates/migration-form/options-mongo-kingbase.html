<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="card" style="margin-top:16px" data-role="options-mongo-kingbase" th:fragment="options">
    <div class="card-head">
        <h2><svg class="ico"><use href="#database"/></svg>
            <span th:text="#{migration.form.options}">Migration options</span></h2>
    </div>
    <div class="card-body">

        <div th:replace="~{migration-form/options-common :: collections(${options})}"></div>

        <div class="grid-2">
            <th:block th:replace="~{migration-form/options-common :: namingFields(${options}, '')}"></th:block>
            <div class="field">
                <label for="opt-writeMode" th:text="#{migration.opt.writeMode}">Write mode</label>
                <select class="input" id="opt-writeMode" name="opt.writeMode">
                    <option value="OVERWRITE"
                            th:selected="${options.get('writeMode') == null or options.get('writeMode').asString('OVERWRITE') == 'OVERWRITE'}"
                            th:text="#{migration.kingbase.writeMode.OVERWRITE}">Delete and rebuild the table</option>
                    <option value="APPEND"
                            th:selected="${options.get('writeMode') != null and options.get('writeMode').asString('') == 'APPEND'}"
                            th:text="#{migration.kingbase.writeMode.APPEND}">Add to the existing table</option>
                    <option value="FAIL_IF_EXISTS"
                            th:selected="${options.get('writeMode') != null and options.get('writeMode').asString('') == 'FAIL_IF_EXISTS'}"
                            th:text="#{migration.kingbase.writeMode.FAIL_IF_EXISTS}">Fail if it exists</option>
                </select>
                <div class="help" th:text="#{migration.kingbase.writeMode.help}">
                    Overwrite drops the target table before creating it again.
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="opt-nestedMode" th:text="#{migration.opt.nestedMode}">Nested documents and arrays</label>
                <select class="input" id="opt-nestedMode" name="opt.nestedMode">
                    <option value="JSON"
                            th:selected="${options.get('nestedMode') == null or options.get('nestedMode').asString('JSON') == 'JSON'}"
                            th:text="#{migration.opt.nestedMode.JSON}">JSON text</option>
                </select>
                <div class="help" th:text="#{migration.opt.nestedModeHelp}">
                    Written as JSON text; nested fields do not become columns.
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="opt-createPrimaryKey" name="opt.createPrimaryKey" value="true"
                           th:checked="${options.get('createPrimaryKey') == null or options.get('createPrimaryKey').asBoolean()}">
                    <input type="hidden" name="opt.createPrimaryKey" value="false">
                    <span th:text="#{migration.opt.createPrimaryKey}">Use _id as the primary key</span>
                </label>
            </div>
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="opt-upsertOnId" name="opt.upsertOnId" value="true"
                           th:checked="${options.get('upsertOnId') != null and options.get('upsertOnId').asBoolean()}">
                    <input type="hidden" name="opt.upsertOnId" value="false">
                    <span th:text="#{migration.opt.upsertOnId}">Overwrite the row with the same _id</span>
                </label>
            </div>
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="opt-continueOnError" name="opt.continueOnError" value="true"
                           th:checked="${options.get('continueOnError') == null or options.get('continueOnError').asBoolean()}">
                    <input type="hidden" name="opt.continueOnError" value="false">
                    <span th:text="#{migration.opt.kingbase.continueOnError}">Keep going after a failed table</span>
                </label>
            </div>
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="opt-verifyCount" name="opt.verifyCount" value="true"
                           th:checked="${options.get('verifyCount') == null or options.get('verifyCount').asBoolean()}">
                    <input type="hidden" name="opt.verifyCount" value="false">
                    <span th:text="#{migration.opt.verifyCount}">Compare document counts afterwards</span>
                </label>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="opt-batchSize" th:text="#{migration.opt.batchSize}">Batch size</label>
                <input type="number" class="input" id="opt-batchSize" name="opt.batchSize"
                       min="1" max="10000"
                       th:value="${options.get('batchSize') != null ? options.get('batchSize').asString('1000') : '1000'}">
            </div>
            <div class="field">
                <label for="opt-sampleLimit" th:text="#{migration.opt.sampleLimit}">Schema sample size</label>
                <input type="number" class="input" id="opt-sampleLimit" name="opt.sampleLimit"
                       min="1" max="1000"
                       th:value="${options.get('sampleLimit') != null ? options.get('sampleLimit').asString('200') : '200'}">
            </div>
            <div class="field">
                <label for="opt-verifySampleSize" th:text="#{migration.opt.verifySampleSize}">Verification sample</label>
                <input type="number" class="input" id="opt-verifySampleSize"
                       name="opt.verifySampleSize" min="0" max="1000"
                       th:value="${options.get('verifySampleSize') != null ? options.get('verifySampleSize').asString('100') : '100'}">
            </div>
            <div class="field">
                <label for="opt-maxCollections" th:text="#{migration.opt.maxCollections}">Maximum collections</label>
                <input type="number" class="input" id="opt-maxCollections" name="opt.maxCollections"
                       min="1" max="10000"
                       th:value="${options.get('maxCollections') != null ? options.get('maxCollections').asString('200') : '200'}">
            </div>
        </div>

    </div>
</div>
</body>
</html>
