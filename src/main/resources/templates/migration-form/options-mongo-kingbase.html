<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="card" style="margin-top:16px" data-role="options-mongo-kingbase" th:fragment="options">
    <div class="card-head">
        <h2><svg class="ico"><use href="#database"/></svg>
            <span th:text="#{migration.form.options}">Migration options</span></h2>
    </div>
    <div class="card-body">

        <div class="field">
            <label for="opt-collectionsText" th:text="#{migration.opt.collections}">Collections</label>
            <textarea class="input mono" id="opt-collectionsText" name="opt.collectionsText"
                      rows="3" placeholder="orders, users"
                      th:text="${options.get('collectionsText') != null ? options.get('collectionsText').asText('') : ''}"></textarea>
            <div class="help">
                <span th:text="#{migration.opt.collectionsHelp}">
                    Comma or newline separated patterns. Leave blank for every non-system collection.
                </span>
                <button type="button" class="btn btn-ghost btn-sm" data-role="discover-indices"
                        th:attr="data-url=@{/api/migrations/indices},
                                 data-empty=#{migration.opt.discover.empty},
                                 data-choose-source=#{migration.opt.discover.chooseSource}">
                    <svg class="ico"><use href="#search"/></svg>
                    <span th:text="#{migration.opt.discoverCollections}">List collections from the source</span>
                </button>
            </div>
            <div class="small muted" data-role="discovered-indices" hidden></div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="opt-targetNaming" th:text="#{migration.opt.targetNaming}">Target name</label>
                <select class="input" id="opt-targetNaming" name="opt.targetNaming">
                    <option value="SAME"
                            th:selected="${options.get('targetNaming') == null or options.get('targetNaming').asText('SAME') == 'SAME'}"
                            th:text="#{migration.naming.SAME}">Same as source</option>
                    <option value="PREFIX"
                            th:selected="${options.get('targetNaming') != null and options.get('targetNaming').asText('') == 'PREFIX'}"
                            th:text="#{migration.naming.PREFIX}">Add a prefix</option>
                    <option value="SUFFIX"
                            th:selected="${options.get('targetNaming') != null and options.get('targetNaming').asText('') == 'SUFFIX'}"
                            th:text="#{migration.naming.SUFFIX}">Add a suffix</option>
                </select>
            </div>
            <div class="field">
                <label for="opt-targetPrefix" th:text="#{migration.opt.prefix}">Prefix</label>
                <input type="text" class="input mono" id="opt-targetPrefix" name="opt.targetPrefix"
                       th:value="${options.get('targetPrefix') != null ? options.get('targetPrefix').asText('') : ''}">
            </div>
            <div class="field">
                <label for="opt-targetSuffix" th:text="#{migration.opt.suffix}">Suffix</label>
                <input type="text" class="input mono" id="opt-targetSuffix" name="opt.targetSuffix"
                       th:value="${options.get('targetSuffix') != null ? options.get('targetSuffix').asText('') : ''}">
            </div>
            <div class="field">
                <label for="opt-writeMode" th:text="#{migration.opt.writeMode}">Write mode</label>
                <select class="input" id="opt-writeMode" name="opt.writeMode">
                    <option value="OVERWRITE"
                            th:selected="${options.get('writeMode') == null or options.get('writeMode').asText('OVERWRITE') == 'OVERWRITE'}"
                            th:text="#{migration.kingbase.writeMode.OVERWRITE}">Delete and rebuild the table</option>
                    <option value="APPEND"
                            th:selected="${options.get('writeMode') != null and options.get('writeMode').asText('') == 'APPEND'}"
                            th:text="#{migration.kingbase.writeMode.APPEND}">Add to the existing table</option>
                    <option value="FAIL_IF_EXISTS"
                            th:selected="${options.get('writeMode') != null and options.get('writeMode').asText('') == 'FAIL_IF_EXISTS'}"
                            th:text="#{migration.kingbase.writeMode.FAIL_IF_EXISTS}">Fail if it exists</option>
                </select>
                <div class="help" th:text="#{migration.kingbase.writeMode.help}">
                    Overwrite drops the target table before creating it again.
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="opt-nestedMode" th:text="#{migration.opt.nestedMode}">Nested documents and arrays</label>
                <select class="input" id="opt-nestedMode" name="opt.nestedMode">
                    <option value="JSON"
                            th:selected="${options.get('nestedMode') == null or options.get('nestedMode').asText('JSON') == 'JSON'}"
                            th:text="#{migration.opt.nestedMode.JSON}">JSON text</option>
                </select>
                <div class="help" th:text="#{migration.opt.nestedModeHelp}">
                    Written as JSON text; nested fields do not become columns.
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="opt-createPrimaryKey" name="opt.createPrimaryKey" value="true"
                           th:checked="${options.get('createPrimaryKey') == null or options.get('createPrimaryKey').asBoolean()}">
                    <input type="hidden" name="opt.createPrimaryKey" value="false">
                    <span th:text="#{migration.opt.createPrimaryKey}">Use _id as the primary key</span>
                </label>
            </div>
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="opt-upsertOnId" name="opt.upsertOnId" value="true"
                           th:checked="${options.get('upsertOnId') != null and options.get('upsertOnId').asBoolean()}">
                    <input type="hidden" name="opt.upsertOnId" value="false">
                    <span th:text="#{migration.opt.upsertOnId}">Overwrite the row with the same _id</span>
                </label>
            </div>
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="opt-continueOnError" name="opt.continueOnError" value="true"
                           th:checked="${options.get('continueOnError') == null or options.get('continueOnError').asBoolean()}">
                    <input type="hidden" name="opt.continueOnError" value="false">
                    <span th:text="#{migration.opt.kingbase.continueOnError}">Keep going after a failed table</span>
                </label>
            </div>
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="opt-verifyCount" name="opt.verifyCount" value="true"
                           th:checked="${options.get('verifyCount') == null or options.get('verifyCount').asBoolean()}">
                    <input type="hidden" name="opt.verifyCount" value="false">
                    <span th:text="#{migration.opt.verifyCount}">Compare document counts afterwards</span>
                </label>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="opt-batchSize" th:text="#{migration.opt.batchSize}">Batch size</label>
                <input type="number" class="input" id="opt-batchSize" name="opt.batchSize"
                       min="1" max="10000"
                       th:value="${options.get('batchSize') != null ? options.get('batchSize').asText('1000') : '1000'}">
            </div>
            <div class="field">
                <label for="opt-sampleLimit" th:text="#{migration.opt.sampleLimit}">Schema sample size</label>
                <input type="number" class="input" id="opt-sampleLimit" name="opt.sampleLimit"
                       min="1" max="1000"
                       th:value="${options.get('sampleLimit') != null ? options.get('sampleLimit').asText('200') : '200'}">
            </div>
            <div class="field">
                <label for="opt-verifySampleSize" th:text="#{migration.opt.verifySampleSize}">Verification sample</label>
                <input type="number" class="input" id="opt-verifySampleSize"
                       name="opt.verifySampleSize" min="0" max="1000"
                       th:value="${options.get('verifySampleSize') != null ? options.get('verifySampleSize').asText('100') : '100'}">
            </div>
            <div class="field">
                <label for="opt-maxCollections" th:text="#{migration.opt.maxCollections}">Maximum collections</label>
                <input type="number" class="input" id="opt-maxCollections" name="opt.maxCollections"
                       min="1" max="10000"
                       th:value="${options.get('maxCollections') != null ? options.get('maxCollections').asText('200') : '200'}">
            </div>
        </div>

    </div>
</div>
</body>
</html>
