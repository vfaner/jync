<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* 三种专属迁移共用的「目标命名」三字段。suffixDefault 由调用方给：
       MongoDB / Elasticsearch 默认 _migrated，MongoDB → KingbaseES 默认留空。
       片段放在 th:block 里，替换后三个 .field 仍是外层 grid-2 的直接子元素，布局不变。 */-->
<th:block th:fragment="namingFields(options, suffixDefault)">
    <div class="field">
        <label for="opt-targetNaming" th:text="#{migration.opt.targetNaming}">Target name</label>
        <select class="input" id="opt-targetNaming" name="opt.targetNaming">
            <option value="SAME"
                    th:selected="${options.get('targetNaming') == null or options.get('targetNaming').asText('SAME') == 'SAME'}"
                    th:text="#{migration.naming.SAME}">Same as source</option>
            <option value="PREFIX"
                    th:selected="${options.get('targetNaming') != null and options.get('targetNaming').asText('') == 'PREFIX'}"
                    th:text="#{migration.naming.PREFIX}">Add a prefix</option>
            <option value="SUFFIX"
                    th:selected="${options.get('targetNaming') != null and options.get('targetNaming').asText('') == 'SUFFIX'}"
                    th:text="#{migration.naming.SUFFIX}">Add a suffix</option>
        </select>
    </div>
    <div class="field">
        <label for="opt-targetPrefix" th:text="#{migration.opt.prefix}">Prefix</label>
        <input type="text" class="input mono" id="opt-targetPrefix" name="opt.targetPrefix"
               th:value="${options.get('targetPrefix') != null ? options.get('targetPrefix').asText('') : ''}">
    </div>
    <div class="field">
        <label for="opt-targetSuffix" th:text="#{migration.opt.suffix}">Suffix</label>
        <input type="text" class="input mono" id="opt-targetSuffix" name="opt.targetSuffix"
               th:value="${options.get('targetSuffix') != null ? options.get('targetSuffix').asText('') : suffixDefault}">
    </div>
</th:block>

<!--/* MongoDB 系列两个目标共用的集合清单字段：textarea + 从源端发现集合的按钮。 */-->
<div class="field" th:fragment="collections(options)">
    <label for="opt-collectionsText" th:text="#{migration.opt.collections}">Collections</label>
    <textarea class="input mono" id="opt-collectionsText" name="opt.collectionsText"
              rows="3" placeholder="orders, users"
              th:text="${options.get('collectionsText') != null ? options.get('collectionsText').asText('') : ''}"></textarea>
    <div class="help">
        <span th:text="#{migration.opt.collectionsHelp}">
            Comma or newline separated patterns. Leave blank for every non-system collection.
        </span>
        <button type="button" class="btn btn-ghost btn-sm" data-role="discover-indices"
                th:attr="data-url=@{/api/migrations/indices},
                         data-empty=#{migration.opt.discover.empty},
                         data-choose-source=#{migration.opt.discover.chooseSource}">
            <svg class="ico"><use href="#search"/></svg>
            <span th:text="#{migration.opt.discoverCollections}">List collections from the source</span>
        </button>
    </div>
    <div class="small muted" data-role="discovered-indices" hidden></div>
</div>

</body>
</html>
