<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 只有“全量进行中”这一小段会频繁变化。单独抽成片段，进度表在活动全量期间每 2 秒刷新时
       只换徽章内容，不替换整行，避免打断游标列输入、行数核对和滚动位置。 */-->
<th:block th:fragment="badge(p)">
    <div th:if="${fullLoadProgress != null and fullLoadProgress.containsKey(p.objectName)}"
         th:with="flp=${fullLoadProgress.get(p.objectName)}"
         class="small" style="font-weight:400;margin-top:2px">
        <span class="badge badge-info" th:title="#{fullload.resumeHint}">
            <span th:if="${flp.parallel}"
                  th:text="#{fullload.parallel(${flp.rangesDone}, ${flp.rangesSeen})}">parallel</span>
            <span th:unless="${flp.parallel}"
                  th:text="#{fullload.sequential}">sequential</span>
        </span>
        <span class="muted" th:text="#{fullload.chunks(${flp.chunksDone})}">chunks</span>
        <span class="muted" th:text="#{fullload.rows(${flp.rowsCopied})}">rows</span>
        <span class="muted" th:if="${flp.lastUpdatedAt != null}"
              th:text="#{fullload.updated(${#temporals.format(flp.lastUpdatedAt, 'MM-dd HH:mm:ss')})}">updated</span>
    </div>
</th:block>

<th:block th:fragment="all">
    <div th:attr="data-full-load-active=${fullLoadTableCount > 0}">
        <div th:each="p : ${progressList}"
             th:attr="data-full-load-badge-table=${p.objectName}">
            <th:block th:replace="~{project-detail/progress-badges :: badge(${p})}"/>
        </div>
    </div>
</th:block>
</body>
</html>
