<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Shared status cells for the merged table-progress card. A finished full load still says
       100%, but the column hides itself once every visible row is at that constant; a live or
       stopped load keeps its percentage. The same fragments are rendered into the hidden
       polling rows, so the 2-second refresh can replace only these read-only cells and never
       touch a cursor input or a preview button. */-->
<!--/* Strategy badge / cursor column, shared by the visible row and the polling
       carrier. A full load records the resolved cursor column at its last chunk, and without
       this cell the row kept its "—" until a page reload. */-->
<td th:fragment="strategyCell(s)" data-status-cell="strategy">
    <th:block th:replace="~{project-detail/table-status :: strategy(${s})}"/>
</td>

<th:block th:fragment="strategy(s)">
    <span class="badge" th:if="${s.cursorStrategy != null}"
          th:classappend="${s.cursorStrategy == 'TIMESTAMP' or s.cursorStrategy == 'ROW_SCN'} ? 'badge-ok'
                        : (${s.cursorStrategy == 'IDENTITY'} ? 'badge-info'
                        : (${s.cursorStrategy == 'FULL_COMPARE'} ? 'badge-warn' : 'badge-danger'))"
          th:title="#{'cursor.strategy.' + ${s.cursorStrategy} + '.help'}">
        <span th:text="#{'cursor.' + ${s.cursorStrategy}}">strategy</span>
    </span>
    <span class="tip-icon tip-warn" tabindex="0" role="img"
          th:if="${s.cursorStrategy == 'IDENTITY' or s.cursorStrategy == 'NONE'}"
          th:attr="aria-label=#{project.strategyWarn}, data-tip=#{project.strategyWarn}">
        <svg class="ico" aria-hidden="true"><use href="#exclamation-triangle-fill"/></svg>
    </span>
    <span class="mono small" th:if="${s.cursorStrategy != null}"
          th:text="${s.cursorColumn ?: '—'}">col</span>
    <span class="muted" th:if="${s.cursorStrategy == null}"
          th:text="#{tablesync.noActive}">—</span>
</th:block>

<td th:fragment="fullState(s)" data-status-cell="fullState">
    <span class="badge"
          th:classappend="${s.state.name() == 'COMPLETED'} ? 'badge-ok'
                        : (${s.state.name() == 'IN_PROGRESS'} ? 'badge-info'
                        : (${s.state.name() == 'INCOMPLETE'} ? 'badge-warn'
                        : 'badge-mute'))"
          th:text="#{'tablesync.state.' + ${s.state.name()}}">state</span>
    <span class="badge badge-info" th:if="${s.externalBaseline}"
          th:title="#{tablesync.externalBaseline.help}"
          th:text="#{tablesync.externalBaseline}">external</span>
    <span class="small muted" th:if="${s.targetsTotal != null}"
          th:text="#{tablesync.targets(${s.targetsDone}, ${s.targetsTotal})}">3/3</span>
</td>

<td th:fragment="incState(s)" data-status-cell="incState">
    <span class="badge"
          th:classappend="${s.incremental.name() == 'RUNNING'} ? 'badge-ok'
                        : (${s.incremental.name() == 'ERROR'} ? 'badge-danger'
                        : (${s.incremental.name() == 'LIMITED'} ? 'badge-warn'
                        : (${s.incremental.name() == 'WAITING'} ? 'badge-info'
                        : 'badge-mute')))"
          th:attr="title=#{'tablesync.inc.' + ${s.incremental.name()} + '.help'}"
          th:text="#{'tablesync.inc.' + ${s.incremental.name()}}">state</span>
</td>

<td th:fragment="lastSync(s)" class="small muted" data-status-cell="lastSync">
    <span th:if="${s.lastSyncTime != null}"
          th:text="${#temporals.format(s.lastSyncTime, 'MM-dd HH:mm:ss')}">never</span>
    <span th:if="${s.lastSyncTime == null and s.fullLoadCompletedAt != null}"
          th:title="#{tablesync.fullLoadCompletedAtHint}"
          th:text="#{tablesync.fullLoadAt(${#temporals.format(s.fullLoadCompletedAt, 'MM-dd HH:mm:ss')})}">full load</span>
    <span th:if="${s.lastSyncTime == null and s.fullLoadCompletedAt == null and s.externalBaseline}"
          th:text="#{tablesync.externalBaseline}">external</span>
    <span th:if="${s.lastSyncTime == null and s.fullLoadCompletedAt == null and !s.externalBaseline}"
          th:text="#{common.never}">never</span>
</td>

<td th:fragment="rowsSynced(s)" class="num small" data-status-cell="rowsSynced"
    th:title="#{tablesync.rowsSynced.help}">
    <span th:if="${s.rowsSyncedTotal != null}" th:text="${s.rowsSyncedTotal}">0</span>
    <span class="muted" th:if="${s.rowsSyncedTotal == null}"
          th:text="#{tablesync.noActive}">—</span>
</td>

<td th:fragment="fullProgress(s)" class="num small" data-status-cell="fullProgress"
    data-role="progress-full"
    th:classappend="${fullLoadAllDone} ? 'is-hidden' : ''">
    <span class="badge" th:if="${s.fullLoadPercent != null}"
          th:classappend="${s.state.name() == 'COMPLETED' and s.fullLoadPercent == 100}
                           ? 'badge-ok' : 'badge-info'"
          th:title="#{tablesync.percentHint}"
          th:text="${s.state.name() == 'COMPLETED' ? '100%' : '~' + s.fullLoadPercent + '%'}">~0%</span>
    <span th:if="${s.fullLoadPercent == null and s.state.name() == 'IN_PROGRESS'}"
          class="small muted" th:text="#{tablesync.loading}">Loading…</span>
    <span th:if="${s.fullLoadPercent == null and s.state.name() != 'IN_PROGRESS'}"
          class="muted" th:text="#{tablesync.noActive}">—</span>
</td>
</body>
</html>
