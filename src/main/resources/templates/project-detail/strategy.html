<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 捕获策略卡片（C1）：CDC 卡片只对严格 MYSQL 源库渲染（验收 C①）。
     selectedStrategy 是选中态的单一事实源：新建 MySQL 项目探测通过时它已经是
     BINLOG_CDC（cdcRecommended），不会出现两张卡同时 checked。 -->
<div class="card" style="margin-top:0" th:fragment="card">
    <div class="card-head">
        <h2><svg class="ico"><use href="#toggles"/></svg> <span th:text="#{project.strategy.title}">Capture strategy</span></h2>
    </div>
    <div class="card-body">
        <div class="strategy-pick" th:with="sel=${selectedStrategy}">
            <!-- 缓存目标只能走日志 CDC：轮询/全量比对会整表重读，且没有 DDL 可同步，
                 展示出来只会让用户选到一个服务端必然拒绝的策略。 -->
            <label class="strategy-card" th:if="${!isRedisTarget}"
                   th:classappend="${sel == 'POLLING'} ? 'picked'">
                <input type="radio" name="captureStrategy" value="POLLING"
                       th:checked="${sel == 'POLLING'}">
                <span class="strategy-name" th:text="#{project.strategy.polling.name}">Polling</span>
                <span class="strategy-desc" th:text="#{project.strategy.polling.desc}">desc</span>
            </label>
            <label class="strategy-card" th:if="${!isRedisTarget}"
                   th:classappend="${sel == 'FULL_COMPARE'} ? 'picked'">
                <input type="radio" name="captureStrategy" value="FULL_COMPARE"
                       th:checked="${sel == 'FULL_COMPARE'}">
                <span class="strategy-name" th:text="#{project.strategy.fullcompare.name}">Full compare</span>
                <span class="strategy-desc" th:text="#{project.strategy.fullcompare.desc}">desc</span>
            </label>
            <label class="strategy-card" th:if="${isYashanSource}"
                   th:classappend="${sel == 'YSTREAM_CDC'} ? 'picked'">
                <input type="radio" name="captureStrategy" value="YSTREAM_CDC"
                       th:checked="${sel == 'YSTREAM_CDC'}">
                <span class="strategy-name">
                    <span th:text="#{project.strategy.ystream.name}">YStream CDC</span>
                    <em class="badge-recommend" th:if="${cdcProbePassed and sel == 'YSTREAM_CDC'}"
                        th:text="#{project.strategy.cdc.recommended}">recommended</em>
                </span>
                <span class="strategy-desc" th:text="#{project.strategy.ystream.desc}">desc</span>
                <span class="strategy-missing" th:if="${cdcProbe != null and !cdcProbePassed and sel == 'YSTREAM_CDC'}">
                    <span th:text="#{project.strategy.cdc.missing}">missing</span>
                    <ul>
                        <li th:each="chk : ${cdcMissingChecks}">✗ <span
                                th:text="#{'cdc.check.' + ${chk.name}}">check</span> — <span
                                th:text="${chk.detail}">detail</span></li>
                    </ul>
                    <a th:href="@{/databases}" th:text="#{project.strategy.cdc.missing.link}">Open connection test</a>
                </span>
            </label>
            <label class="strategy-card" th:if="${isMysqlSource}"
                   th:classappend="${sel == 'BINLOG_CDC'} ? 'picked'">
                <input type="radio" name="captureStrategy" value="BINLOG_CDC"
                       th:checked="${sel == 'BINLOG_CDC'}">
                <span class="strategy-name">
                    <span th:text="#{project.strategy.cdc.name}">Binlog CDC</span>
                    <em class="badge-recommend" th:if="${cdcProbePassed and sel == 'BINLOG_CDC'}"
                        th:text="#{project.strategy.cdc.recommended}">recommended</em>
                </span>
                <span class="strategy-desc" th:text="#{project.strategy.cdc.desc}">desc</span>
                <!-- 探测未通过：逐项列出缺失前提（cdc.check.* 键来自 B2），并给出
                     连接测试页入口。探测抛异常时 cdcProbe 为 null，整块不渲染。 -->
                <span class="strategy-missing" th:if="${cdcProbe != null and !cdcProbePassed and sel == 'BINLOG_CDC'}">
                    <span th:text="#{project.strategy.cdc.missing}">missing</span>
                    <ul>
                        <li th:each="chk : ${cdcMissingChecks}">✗ <span
                                th:text="#{'cdc.check.' + ${chk.name}}">check</span> — <span
                                th:text="${chk.detail}">detail</span></li>
                    </ul>
                    <a th:href="@{/databases}" th:text="#{project.strategy.cdc.missing.link}">Open connection test</a>
                </span>
            </label>
            <label class="strategy-card" th:if="${isOracleSource}"
                   th:classappend="${sel == 'LOGMINER_CDC'} ? 'picked'">
                <input type="radio" name="captureStrategy" value="LOGMINER_CDC"
                       th:checked="${sel == 'LOGMINER_CDC'}">
                <span class="strategy-name">
                    <span th:text="#{project.strategy.logminer.name}">LogMiner CDC</span>
                    <em class="badge-recommend" th:if="${cdcProbePassed and sel == 'LOGMINER_CDC'}"
                        th:text="#{project.strategy.cdc.recommended}">recommended</em>
                </span>
                <span class="strategy-desc" th:text="#{project.strategy.logminer.desc}">desc</span>
                <span class="strategy-missing" th:if="${cdcProbe != null and !cdcProbePassed and sel == 'LOGMINER_CDC'}">
                    <span th:text="#{project.strategy.cdc.missing}">missing</span>
                    <ul>
                        <li th:each="chk : ${cdcMissingChecks}">✗ <span
                                th:text="#{'cdc.check.' + ${chk.name}}">check</span> — <span
                                th:text="${chk.detail}">detail</span></li>
                    </ul>
                    <a th:href="@{/databases}" th:text="#{project.strategy.cdc.missing.link}">Open connection test</a>
                </span>
            </label>
            <label class="strategy-card" th:if="${isPostgresSource}"
                   th:classappend="${sel == 'PG_LOGICAL_CDC'} ? 'picked'">
                <input type="radio" name="captureStrategy" value="PG_LOGICAL_CDC"
                       th:checked="${sel == 'PG_LOGICAL_CDC'}">
                <span class="strategy-name">
                    <span th:text="#{project.strategy.pg.name}">PG Logical CDC</span>
                    <em class="badge-recommend" th:if="${cdcProbePassed and sel == 'PG_LOGICAL_CDC'}"
                        th:text="#{project.strategy.cdc.recommended}">recommended</em>
                </span>
                <span class="strategy-desc" th:text="#{project.strategy.pg.desc}">desc</span>
                <span class="strategy-missing" th:if="${cdcProbe != null and !cdcProbePassed and sel == 'PG_LOGICAL_CDC'}">
                    <span th:text="#{project.strategy.cdc.missing}">missing</span>
                    <ul>
                        <li th:each="chk : ${cdcMissingChecks}">✗ <span
                                th:text="#{'cdc.check.' + ${chk.name}}">check</span> — <span
                                th:text="${chk.detail}">detail</span></li>
                    </ul>
                    <a th:href="@{/databases}" th:text="#{project.strategy.cdc.missing.link}">Open connection test</a>
                </span>
            </label>
            <label class="strategy-card" th:if="${isSqlServerSource}"
                   th:classappend="${sel == 'SQLSERVER_CDC'} ? 'picked'">
                <input type="radio" name="captureStrategy" value="SQLSERVER_CDC"
                       th:checked="${sel == 'SQLSERVER_CDC'}">
                <span class="strategy-name">
                    <span th:text="#{project.strategy.sqlserver.name}">SQL Server CDC</span>
                    <em class="badge-recommend" th:if="${cdcProbePassed and sel == 'SQLSERVER_CDC'}"
                        th:text="#{project.strategy.cdc.recommended}">recommended</em>
                </span>
                <span class="strategy-desc" th:text="#{project.strategy.sqlserver.desc}">desc</span>
                <span class="strategy-missing" th:if="${cdcProbe != null and !cdcProbePassed and sel == 'SQLSERVER_CDC'}">
                    <span th:text="#{project.strategy.cdc.missing}">missing</span>
                    <ul>
                        <li th:each="chk : ${cdcMissingChecks}">✗ <span
                                th:text="#{'cdc.check.' + ${chk.name}}">check</span> — <span
                                th:text="${chk.detail}">detail</span></li>
                    </ul>
                    <a th:href="@{/databases}" th:text="#{project.strategy.cdc.missing.link}">Open connection test</a>
                </span>
            </label>
        </div>
    </div>
</div>
</body>
</html>
