<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 一源多目标的独立卡片：中转方式在创建/编辑任务时选好，这里只读展示；卡片只留
      搜索和每目标的位点/积压。只有配置了额外目标的项目才渲染（fanoutStatuses 非空）。 */-->
<div class="card fanout-card" th:fragment="card"
     th:if="${fanoutStatuses != null and !#lists.isEmpty(fanoutStatuses)}"
     th:attr="data-refresh-url=@{/projects/{id}/fanout-status(id=${project.id})}">
    <div class="card-head">
        <h2>
            <svg class="ico"><use href="#diagram-3"/></svg>
            <span th:text="#{fanoutCard.title}">One source, many targets</span>
            <span class="badge badge-info"
                  th:text="#{fanoutCard.count(${#lists.size(fanoutStatuses)})}">3 targets</span>
            <span class="badge badge-mute fanout-transport-badge"
                  th:if="${fanoutTransportLabel != null}"
                  th:text="${fanoutTransportLabel}">Local spool</span>
        </h2>
        <input type="text" class="input mono fanout-search-input" data-role="fanout-search"
               th:placeholder="#{fanoutCard.search}"
               th:attr="aria-label=#{fanoutCard.search}">
    </div>
    <div class="card-body">
        <div class="tbl-wrap fanout-table-wrap">
            <table class="tbl dense fanout-table" data-role="fanout-table">
                <thead>
                <tr>
                    <th th:text="#{fanoutCard.target}">Target</th>
                    <th th:text="#{fanoutCard.position}">Position</th>
                    <th th:text="#{fanoutCard.lastAck}">Last ack</th>
                    <th th:text="${config.fanoutTransport == 'REDIS'}
                                 ? #{fanoutCard.backlogRedis} : #{fanoutCard.backlogSpool}">Backlog</th>
                    <th class="num" th:text="#{fanoutCard.applied}">Applied</th>
                    <th th:text="#{fanoutCard.worker}">Writer</th>
                </tr>
                </thead>
                <tbody data-role="fanout-rows" th:fragment="rows">
                <tr th:each="s : ${fanoutStatuses}"
                    th:attr="data-search=${s.name + ' ' + s.type + ' ' + s.endpoint}">
                    <td>
                        <div class="fanout-target-name">
                            <b th:text="${s.name}">target</b>
                            <span class="badge badge-mute" th:if="${s.type != null}"
                                  th:text="#{${'db.type.' + s.type}}">MySQL</span>
                            <span class="badge badge-info" th:if="${s.primary}"
                                  th:text="#{fanoutCard.role.primary}">primary</span>
                        </div>
                        <div class="small muted mono" th:if="${s.endpoint != null}"
                             th:text="${s.endpoint}">127.0.0.1:3306</div>
                    </td>
                    <td class="mono">
                        <span th:if="${s.file != null}" th:text="|${s.file}:${s.pos}|">binlog:pos</span>
                        <span th:if="${s.file == null and s.lsn != null}" th:text="|LSN ${s.lsn}|">LSN</span>
                        <span th:if="${s.file == null and s.lsn == null and s.scn != null}"
                              th:text="|SCN ${s.scn}|">SCN</span>
                        <span th:if="${s.file == null and s.lsn == null and s.scn == null}"
                              class="fanout-status-state"
                              th:text="#{option.fanoutNoPosition}">not consumed yet</span>
                    </td>
                    <td class="small muted"
                        th:text="${s.ageSeconds != null} ? #{option.fanoutAge(${s.ageSeconds})} : '—'">—</td>
                    <td>
                        <span th:if="${s.transport != 'REDIS'}" class="fanout-spool-metric"
                              th:text="${s.spoolText}">0 B</span>
                        <span th:if="${s.transport == 'REDIS'}" class="fanout-transport-badge"
                              th:attr="data-tip=#{fanoutCard.redisBacklogHint}"
                              th:text="#{fanoutCard.redisBacklog}">Redis</span>
                    </td>
                    <td class="num small"
                        th:text="${s.appliedTransactions != null} ? ${s.appliedTransactions} : '—'">—</td>
                    <td class="small">
                        <span th:if="${s.workerError != null}" class="fanout-worker-error tip-text"
                              th:attr="data-tip=${s.workerError}"
                              th:text="#{fanoutCard.stopped}">stopped</span>
                        <span th:if="${s.workerError == null and s.workerAlive != null}"
                              th:text="${s.workerAlive} ? #{fanoutCard.running} : #{fanoutCard.stopped}">running</span>
                        <span th:if="${s.workerError == null and s.workerAlive == null}"
                              class="muted">—</span>
                    </td>
                </tr>
                <tr data-role="fanout-no-match" hidden>
                    <td colspan="6" class="small muted" th:text="#{fanoutCard.noMatch}">No match.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
