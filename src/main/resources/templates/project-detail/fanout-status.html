<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* One fan-out target row: name, last acknowledged position and spool backlog. Polled
       independently of the table-status fragment because it only changes while the project
       runs. */-->
<div th:fragment="missing"></div>
<div th:fragment="list" class="fanout-status-list">
    <p class="small muted" style="margin:0 0 4px"
       th:text="#{option.fanoutStatusTitle}">Targets</p>
    <ul class="small muted" style="margin:0 0 0 18px;padding:0">
        <li th:each="s : ${fanoutStatuses}">
            <b th:text="${s.name}">target</b>
            <span th:if="${s.file != null}" class="mono"
                  th:text="|${s.file}:${s.pos}|">binlog:pos</span>
            <span th:if="${s.file == null and s.lsn != null}" class="mono"
                  th:text="|LSN ${s.lsn}|">LSN</span>
            <span th:if="${s.file == null and s.lsn == null and s.scn != null}" class="mono"
                  th:text="|SCN ${s.scn}|">SCN</span>
            <span th:if="${s.file == null and s.lsn == null and s.scn == null}"
                  class="fanout-status-state"
                  th:text="#{option.fanoutNoPosition}">not consumed yet</span>
            <span th:if="${s.ageSeconds != null}" class="fanout-status-meta"
                  th:text="#{option.fanoutAge(${s.ageSeconds})}">age</span>
            <span th:if="${s.transport != 'REDIS'}" class="fanout-spool-metric"
                  th:text="#{option.fanoutSpool(${s.spoolText})}">spool</span>
            <span th:if="${s.transport == 'REDIS'}" class="fanout-transport-badge"
                  th:text="#{option.fanoutRedisQueue}">Redis Stream</span>
            <span th:if="${s.appliedTransactions != null}" class="fanout-status-meta"
                  th:text="#{option.fanoutApplied(${s.appliedTransactions})}">applied</span>
            <span th:if="${s.workerError != null}" class="fanout-worker-error"
                  th:text="#{option.fanoutWorkerStopped(${s.workerError})}">stopped</span>
        </li>
    </ul>
</div>
</body>
</html>
