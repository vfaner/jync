<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 同步选项 -->
<div class="card" style="margin-top:0" th:fragment="card">
    <div class="card-head">
        <h2><svg class="ico"><use href="#toggles"/></svg> <span th:text="#{project.syncOptions}">Options</span></h2>
    </div>
    <div class="card-body">
        <!--/* 日志 CDC 下「表结构/表数据」不参与增量流(消费者只按所选表
               过滤,行变更照常应用),基线执行时又会被强制打开,显示出来只会
               诱导无效修改:隐藏但不禁用,提交时保存值原样带回,切回
               轮询后恢复显示。索引不同:基线按保存值执行,不影响正确性,
               因此保持可见可改。视图/存储过程见下方基线分组。 */-->
        <p class="small muted" data-cdc-visibility="cdc"
           th:classappend="${selectedCdc} ? '' : 'is-hidden'"
           style="margin:0 0 10px" th:text="#{project.syncOptions.cdcHidden}">Log CDC mode: the polling switches are hidden.</p>
        <label class="switch" data-role="polling-only"
               th:classappend="${selectedCdc} ? 'is-hidden' : ''">
            <!-- 源库一张表都没有时,表结构/表数据/索引无从同步:强制关并置灰,
                 避免开着空开关点保存被「至少选择一张表」拦下。列举失败(sourceObjects
                 为 null)属于临时状况,保持已保存配置不动。 -->
            <input type="checkbox" name="syncStructure" value="true"
                   th:checked="${config.syncStructure and (sourceObjects == null or !#lists.isEmpty(sourceObjects.tables))}"
                   th:disabled="${sourceObjects != null and #lists.isEmpty(sourceObjects.tables)}">
            <span class="track"></span>
            <span class="switch-text">
                <strong th:text="#{option.syncStructure}">Structure</strong>
                <span class="help" th:text="#{option.syncStructureHelp}">help</span>
            </span>
        </label>
        <label class="switch" data-role="polling-only"
               th:classappend="${selectedCdc} ? 'is-hidden' : ''">
            <input type="checkbox" name="syncData" value="true"
                   th:checked="${config.syncData and (sourceObjects == null or !#lists.isEmpty(sourceObjects.tables))}"
                   th:disabled="${sourceObjects != null and #lists.isEmpty(sourceObjects.tables)}">
            <span class="track"></span>
            <span class="switch-text">
                <strong th:text="#{option.syncData}">Data</strong>
                <span class="help" th:text="#{option.syncDataHelp}">help</span>
            </span>
        </label>
        <!-- 索引开关不随 CDC 隐藏:基线按保存值执行,关掉就不会建/重建二级索引。 -->
        <label class="switch">
            <input type="checkbox" name="syncIndexes" value="true"
                   th:checked="${config.syncIndexes and (sourceObjects == null or !#lists.isEmpty(sourceObjects.tables))}"
                   th:disabled="${sourceObjects != null and #lists.isEmpty(sourceObjects.tables)}">
            <span class="track"></span>
            <span class="switch-text">
                <strong th:text="#{option.syncIndexes}">Indexes</strong>
                <span class="help" th:text="#{option.syncIndexesHelp}">help</span>
            </span>
        </label>
        <!-- 自动同步新增表:开启后只加入开启之后出现的源表;首轮先快照现有表清单。 -->
        <label class="switch">
            <input type="checkbox" name="autoSyncNewTables" value="true"
                   th:checked="${config.autoSyncNewTables}">
            <span class="track"></span>
            <span class="switch-text">
                <strong>
                    <span th:text="#{option.autoSyncNewTables}">Auto-sync new tables</span>
                    <!--/* 逐引擎的差异放进悬停提示：开关旁边只留一句概括。 */-->
                    <span class="tip-icon" tabindex="0" role="img"
                          th:attr="aria-label=#{option.autoSyncNewTablesTip},
                                   data-tip=#{option.autoSyncNewTablesTip}">
                        <svg class="ico" aria-hidden="true"><use href="#question-circle"/></svg>
                    </span>
                </strong>
                <span class="help" th:text="#{option.autoSyncNewTablesHelp}">help</span>
            </span>
        </label>
        <!-- 一源多目标的事件中转：按项目选择，留空跟随服务端默认值。目标选择在新建/编辑页
             维护；这里只读展示位点/积压并 5 秒刷新。 -->
        <div class="field" th:if="${fanoutStatuses != null and !#lists.isEmpty(fanoutStatuses)}">
            <label for="fanoutTransport" th:text="#{option.fanoutTransport}">Event transport</label>
            <select class="select" id="fanoutTransport" name="fanoutTransport"
                    data-role="fanout-transport">
                <option value="SPOOL"
                        th:selected="${config.fanoutTransport == null
                                       or #strings.isEmpty(config.fanoutTransport)
                                       or config.fanoutTransport == 'SPOOL'}"
                        th:text="#{option.fanoutTransport.spool}">Local spool</option>
                <option value="REDIS" th:selected="${config.fanoutTransport == 'REDIS'}"
                        th:text="#{option.fanoutTransport.redis}">Redis Stream</option>
            </select>
            <!--/* Redis 中转直接复用已配置的 Redis 目标（缓存目标那套连接、加密口令），
                   不再让用户去服务端配置里找 URI。集群目标不在候选里。 */-->
            <select class="select fanout-redis-target" id="fanoutRedisTargetId"
                    name="fanoutRedisTargetId" data-role="fanout-redis-target"
                    th:classappend="${config.fanoutTransport == 'REDIS'} ? '' : 'is-hidden'">
                <option value="" th:text="#{option.fanoutTransport.target}">Choose a Redis target</option>
                <option th:each="rt : ${fanoutRedisTargets}" th:value="${rt.id}"
                        th:selected="${config.fanoutRedisTargetId != null
                                       and config.fanoutRedisTargetId == rt.id}"
                        th:text="|${rt.name} · ${rt.host}:${rt.port}|">redis</option>
            </select>
            <div class="help" th:text="#{option.fanoutTransportHelp}">help</div>
        </div>
        <!-- 一源多目标：目标选择在新建/编辑页维护；这里只读展示并 5 秒刷新位点/积压。 -->
        <div id="fanout-status" th:if="${fanoutStatuses != null and !#lists.isEmpty(fanoutStatuses)}"
             style="margin-top:12px"
             th:attr="data-refresh-url=@{/projects/{id}/fanout-status(id=${project.id})}">
            <div th:replace="~{project-detail/fanout-status :: list}"/>
        </div>
        <th:block th:replace="~{project-detail/baseline-options :: group}"/>
    </div>
</div>
</body>
</html>
