<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::scripts}, 'change-logs', 'log.title')}">
<body>
<th:block th:fragment="content" th:remove="tag">
<div th:remove="tag">

    <div class="page-head">
        <div>
            <h1 th:text="#{log.title}">Change log</h1>
            <p class="sub">
                <span id="log-count" th:text="${pager.totalItems}">0</span>
                <span th:text="#{log.entries}">entries</span>
                <!--/* 文案模板留在 data-tpl 里，而不是塞进 layout 的全局
                       JyncMessages —— 只有这一页用得上。 */-->
                <span id="log-updated" class="muted" hidden
                      th:data-tpl="#{log.refresh.updated}"></span>
            </p>
        </div>
        <div class="page-actions">
            <form method="get" th:action="@{/change-logs}" class="inline-form">
                <select class="select" name="projectId" onchange="this.form.submit()" style="min-width:210px">
                    <option value="" th:text="#{log.allProjects}">All projects</option>
                    <option th:each="p : ${projects}" th:value="${p.id}"
                            th:selected="${selectedProjectId != null and selectedProjectId == p.id}"
                            th:text="${p.name}">Project</option>
                </select>
                <label class="check-inline" title="">
                    <input type="checkbox" name="failedOnly" value="true"
                           onchange="this.form.submit()"
                           th:checked="${failedOnly}">
                    <span th:text="#{log.failedOnly}">Errors only</span>
                </label>
            </form>
            <!--/* 刷新是读操作，两个角色都该有 —— 所以放在下面 isAdmin 那层外面。 */-->
            <button type="button" class="btn btn-ghost btn-sm" data-role="log-refresh">
                <svg class="ico"><use href="#arrow-clockwise"/></svg><span th:text="#{log.refresh}">Refresh</span></button>
            <!--/* 第二页往后不自动刷新：日志按时间倒序，新条目一进来整页就往下挪，
                   自动刷新会让你读的那几行一直在换位置。禁用而不是悄悄不动，
                   title 里说清为什么。 */-->
            <button type="button" class="btn btn-ghost btn-sm" data-role="log-auto"
                    th:disabled="${pager.page > 1}"
                    th:title="${pager.page > 1} ? #{log.refresh.firstPageOnly} : null">
                <svg class="ico"><use href="#arrow-repeat"/></svg><span th:text="#{log.refresh.auto}">Auto</span></button>
            <form method="post" th:if="${isAdmin}" th:action="@{/change-logs/clear}"
                  th:data-confirm="#{log.clear.confirm}">
                <input type="hidden" name="projectId" th:value="${selectedProjectId}">
                <input type="hidden" name="failedOnly" th:if="${failedOnly}" value="true">
                <button type="submit" class="btn btn-ghost btn-warn">
                    <svg class="ico"><use href="#trash"/></svg><span th:text="#{log.clear}">Clear</span></button>
            </form>
        </div>
    </div>

    <!--/* 基底 URL 必须提前算好：Thymeleaf 的片段调用参数里不认
           @{/x}(k=v) 这种带参链接表达式（括号配对会把签名解析搞崩），
           所以在外层 th:with 里先展开成普通字符串再传进去。 */-->
    <div class="card" id="log-card"
         th:with="pagerBase=@{/change-logs(projectId=${selectedProjectId},
                                            failedOnly=${failedOnly} ? 'true' : null)}">
        <div class="card-body tight">
            <div th:if="${logs.totalElements == 0}" class="empty">
                <div class="empty-ico"><svg class="ico"><use href="#clock-history"/></svg></div>
                <h3 th:text="${failedOnly} ? #{log.noErrors} : #{log.noLogs}">No changes recorded.</h3>
            </div>

            <div th:unless="${logs.totalElements == 0}" class="tbl-wrap">
                <table class="tbl dense">
                    <thead>
                    <tr>
                        <th th:text="#{log.occurredAt}">Time</th>
                        <th th:text="#{log.objectType}">Type</th>
                        <th th:text="#{log.objectName}">Object</th>
                        <th th:text="#{log.changeType}">Change</th>
                        <th class="num" th:text="#{log.affectedRows}">Rows</th>
                        <th class="num" th:text="#{common.duration}">Duration</th>
                        <th th:text="#{common.details}">Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${logs.content}" th:classappend="${!log.success} ? 'row-bad' : ''"
                        th:with="raw=${log.details},
                                  skippedDdl=${log.details != null and log.details.startsWith('CDC_SKIPPED_DDL:')}">
                        <td class="small mono" style="white-space:nowrap"
                            th:text="${#temporals.format(log.occurredAt, 'yyyy-MM-dd HH:mm:ss')}">time</td>
                        <td>
                            <span class="badge badge-brand"
                                  th:text="${skippedDdl} ? #{log.ddl.objectType} : #{'objectType.' + ${log.objectType}}">Table</span>
                        </td>
                        <td class="mono small" th:text="${log.objectName ?: '—'}">object</td>
                        <td th:with="ct=${log.changeType.name()}">
                            <span class="badge"
                                  th:classappend="${ct == 'ERROR'} ? 'badge-danger'
                                                : (${ct == 'DROP' or ct == 'DELETE'} ? 'badge-warn'
                                                : (${ct == 'CREATE'} ? 'badge-ok' : 'badge-mute'))"
                                  th:text="#{'changeType.' + ${ct}}">Create</span>
                        </td>
                        <td class="num" th:text="${log.affectedRows ?: '—'}">0</td>
                        <td class="num small muted"
                            th:text="${log.durationMs != null and log.durationMs > 0} ? ${log.durationLabel} : '—'">—</td>
                        <td th:with="raw=${log.details},
                                      skippedDdl=${log.details != null and log.details.startsWith('CDC_SKIPPED_DDL:')},
                                      statusKey=${log.resolutionStatus == 'PROCESSED' ? 'log.ddl.processed' : (log.ddlExecuted != null and log.ddlExecuted ? 'log.ddl.awaitingReplay' : 'log.ddl.pending')},
                                      statusCls=${log.resolutionStatus == 'PROCESSED' ? 'badge-ok' : (log.ddlExecuted != null and log.ddlExecuted ? 'badge-brand' : 'badge-warn')}" style="white-space:nowrap">
                            <div th:if="${skippedDdl}" class="ddl-inline">
                                <details class="ddl-detail">
                                    <summary th:text="#{log.detail.cdc.ddlSkipped}">查看完整 DDL</summary>
                                    <pre class="wrap-detail"
                                         th:text="${raw.substring(raw.indexOf(':') + 1)}">ddl</pre>
                                    <div th:if="${log.affectedTables != null}" class="small">
                                        <span th:text="#{log.ddl.affectedTables}">未同步的表与列</span>:
                                        <span class="mono" th:text="${log.affectedTables}">file_info(suffix)</span>
                                    </div>
                                </details>
                                <button type="button" class="badge badge-btn"
                                        th:if="${log.resolutionStatus != null}"
                                        th:classappend="${statusCls}"
                                        th:attr="data-role=ddl-open,data-ddl-id=${log.id},data-ddl-sql=${log.targetDdlSql},data-ddl-src-db=${log.objectName},data-ddl-target-db=${targetDatabaseName},data-ddl-error=${log.errorDetail},data-ddl-executed=${log.ddlExecuted != null and log.ddlExecuted},data-ddl-replayed=${log.replayDone != null and log.replayDone},data-ddl-text-pending=#{log.ddl.pending},data-ddl-text-executed=#{log.ddl.awaitingReplay},data-ddl-text-processed=#{log.ddl.processed},data-ddl-confirm=#{log.ddl.retryConfirm},data-ddl-needs-ddl=#{log.ddl.retryNeedsDdl},data-ddl-gap=${log.affectedTables}"
                                        th:text="#{${statusKey}}">pending</button>
                            </div>
                            <div th:unless="${skippedDdl}" class="wrap-detail"
                                 th:classappend="${!log.success} ? '' : 'muted'"
                                 th:style="${!log.success} ? 'color:var(--danger)' : ''"
                                 th:text="${@changeLogDetailsLocalizer.localize(log.details) ?: ''}">details</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:replace="~{fragments/pager :: pager(${pager}, ${pagerBase})}"></div>
    </div>

    <!-- One shared dialog for every DDL task: the status tag fills it in (bindDdlOpen).
         The per-row <details> only shows the statement; the dialog is where it is run. -->
    <div class="modal" id="ddl-execute-modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-mask" data-role="ddl-close"></div>
        <div class="modal-dialog" style="max-width:820px">
            <button type="button" class="modal-close" data-role="ddl-close"
                    th:aria-label="#{log.ddl.cancel}">×</button>
            <div class="modal-head">
                <h3 th:text="#{log.ddl.dialogTitle}">Execute DDL on the target</h3>
            </div>
            <div class="preview-body" style="text-align: left;border: none;">
                <p class="help small muted" th:text="#{log.ddl.editHint}">Only COMMENT text and
                    dialect details may be edited; table and column names are locked.</p>
                <label for="ddl-execute-sql" style="position:absolute;left:-9999px"
                       th:text="#{log.ddl.viewStatement}">DDL statement</label>
                <textarea id="ddl-execute-sql" class="input mono sql-edit" rows="10" wrap="soft"
                          spellcheck="false" style="white-space:pre; overflow-x:auto"></textarea>
                <div id="ddl-execute-error" class="small" style="color:var(--danger)"></div>
                <div id="ddl-execute-state" class="small muted text-red"></div>
                <div id="ddl-execute-gap" class="small mono" style="white-space:pre-wrap"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost btn-sm" data-role="ddl-close"
                        th:text="#{log.ddl.cancel}">Cancel</button>
                <button type="button" class="btn btn-ghost btn-sm" data-role="ddl-retry"
                        th:text="#{log.ddl.retry}">Replay missing rows</button>
                <button type="button" class="btn btn-primary btn-sm" data-role="ddl-execute"
                        th:text="#{log.ddl.execute}">Execute on target</button>
            </div>
        </div>
    </div>

    <!-- 每行可编辑语句的副本：弹窗从这里取文本，避免把长 SQL 塞进 data 属性。 -->
    <div th:each="log : ${logs.content}"
         th:if="${log.details != null and log.details.startsWith('CDC_SKIPPED_DDL:')}"
         style="display:none" th:id="${'ddl-sql-' + log.id}"
         th:text="${log.targetDdlSql}">sql</div>

</div>
</th:block>

<th:block th:fragment="scripts" th:remove="tag">
    <!--/* DDL 待办弹窗是本页私有的：app.js 只提供弹窗体、带 CSRF 的 POST 与提示框这些
           通用能力，具体怎么填语句、怎么按行刷新按钮状态，都留在 change-logs.js 里。 */-->
    <script th:src="@{/js/change-logs.js(v=${appVersion})}"></script>
</th:block>
</body>
</html>
