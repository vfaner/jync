<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::scripts}, 'change-logs', 'log.title')}">
<body>
<th:block th:fragment="content" th:remove="tag">
<div th:remove="tag">

    <div class="page-head">
        <div>
            <h1 th:text="#{log.title}">Change log</h1>
            <p class="sub">
                <span id="log-count" th:text="${pager.totalItems}">0</span>
                <span th:text="#{log.entries}">entries</span>
                <!--/* 文案模板留在 data-tpl 里，而不是塞进 layout 的全局
                       JyncMessages —— 只有这一页用得上。 */-->
                <span id="log-updated" class="muted" hidden
                      th:data-tpl="#{log.refresh.updated}"></span>
            </p>
        </div>
        <div class="page-actions">
            <form method="get" th:action="@{/change-logs}">
                <select class="select" name="projectId" onchange="this.form.submit()" style="min-width:210px">
                    <option value="" th:text="#{log.allProjects}">All projects</option>
                    <option th:each="p : ${projects}" th:value="${p.id}"
                            th:selected="${selectedProjectId != null and selectedProjectId == p.id}"
                            th:text="${p.name}">Project</option>
                </select>
            </form>
            <!--/* 刷新是读操作，两个角色都该有 —— 所以放在下面 isAdmin 那层外面。 */-->
            <button type="button" class="btn btn-ghost btn-sm" data-role="log-refresh">
                <svg class="ico"><use href="#arrow-clockwise"/></svg><span th:text="#{log.refresh}">Refresh</span></button>
            <!--/* 第二页往后不自动刷新：日志按时间倒序，新条目一进来整页就往下挪，
                   自动刷新会让你读的那几行一直在换位置。禁用而不是悄悄不动，
                   title 里说清为什么。 */-->
            <button type="button" class="btn btn-ghost btn-sm" data-role="log-auto"
                    th:disabled="${pager.page > 1}"
                    th:title="${pager.page > 1} ? #{log.refresh.firstPageOnly} : null">
                <svg class="ico"><use href="#arrow-repeat"/></svg><span th:text="#{log.refresh.auto}">Auto</span></button>
            <form method="post" th:if="${isAdmin}" th:action="@{/change-logs/clear}"
                  th:data-confirm="#{log.clear.confirm}">
                <input type="hidden" name="projectId" th:value="${selectedProjectId}">
                <button type="submit" class="btn btn-ghost btn-sm btn-warn">
                    <svg class="ico"><use href="#trash"/></svg><span th:text="#{log.clear}">Clear</span></button>
            </form>
        </div>
    </div>

    <!--/* 基底 URL 必须提前算好：Thymeleaf 的片段调用参数里不认
           @{/x}(k=v) 这种带参链接表达式（括号配对会把签名解析搞崩），
           所以在外层 th:with 里先展开成普通字符串再传进去。 */-->
    <div class="card" id="log-card"
         th:with="pagerBase=@{/change-logs(projectId=${selectedProjectId})}">
        <div class="card-body tight">
            <div th:if="${logs.totalElements == 0}" class="empty">
                <div class="empty-ico"><svg class="ico"><use href="#clock-history"/></svg></div>
                <h3 th:text="#{log.noLogs}">No changes recorded.</h3>
            </div>

            <div th:unless="${logs.totalElements == 0}" class="tbl-wrap">
                <table class="tbl dense">
                    <thead>
                    <tr>
                        <th th:text="#{log.occurredAt}">Time</th>
                        <th th:text="#{log.objectType}">Type</th>
                        <th th:text="#{log.objectName}">Object</th>
                        <th th:text="#{log.changeType}">Change</th>
                        <th class="num" th:text="#{log.affectedRows}">Rows</th>
                        <th class="num" th:text="#{common.duration}">Duration</th>
                        <th th:text="#{common.details}">Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${logs.content}" th:classappend="${!log.success} ? 'row-bad' : ''">
                        <td class="small mono" style="white-space:nowrap"
                            th:text="${#temporals.format(log.occurredAt, 'yyyy-MM-dd HH:mm:ss')}">time</td>
                        <td>
                            <span class="badge badge-brand"
                                  th:text="#{'objectType.' + ${log.objectType}}">Table</span>
                        </td>
                        <td class="mono small" th:text="${log.objectName ?: '—'}">object</td>
                        <td th:with="ct=${log.changeType.name()}">
                            <span class="badge"
                                  th:classappend="${ct == 'ERROR'} ? 'badge-danger'
                                                : (${ct == 'DROP' or ct == 'DELETE'} ? 'badge-warn'
                                                : (${ct == 'CREATE'} ? 'badge-ok' : 'badge-mute'))"
                                  th:text="#{'changeType.' + ${ct}}">Create</span>
                        </td>
                        <td class="num" th:text="${log.affectedRows ?: '—'}">0</td>
                        <td class="num small muted"
                            th:text="${log.durationMs != null and log.durationMs > 0} ? ${log.durationMs} + ' ms' : '—'">—</td>
                        <td>
                            <div class="wrap-detail" th:classappend="${!log.success} ? '' : 'muted'"
                                 th:style="${!log.success} ? 'color:var(--danger)' : ''"
                                 th:text="${log.details ?: ''}">details</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:replace="~{fragments/pager :: pager(${pager}, ${pagerBase})}"></div>
    </div>

</div>
</th:block>

<th:block th:fragment="scripts" th:remove="tag"></th:block>
</body>
</html>
