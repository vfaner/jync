<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::scripts}, 'etl', 'etl.form.title')}">
<body>
<th:block th:fragment="content" th:remove="tag">
<div th:remove="tag">

    <!--/* ETL 表单只做装配：每段一个模块文件（etl-form/）。
           连接、取数来源（SQL / 原生 MongoDB）、目标写入、脚本选项各自成文件；
           调度、上次运行、预检也各自独立。改 Mongo 源的字段碰不到 SQL 源，改调度
           碰不到预检。源/目标引擎的专属参数在 basic 卡片的两个插槽里接。 */-->
    <th:block th:replace="~{etl-form/head :: pageHead}"/>

    <div style="max-width:960px">
        <th:block th:replace="~{etl-form/head :: alerts}"/>

        <form method="post" th:action="@{/etl/save}">
            <input type="hidden" name="id" th:value="${task.id}">
            <th:block th:replace="~{etl-form/basic :: card}"/>
            <th:block th:replace="~{etl-form/schedule :: card}"/>
        </form>

        <th:block th:replace="~{etl-form/last-run :: card}"/>
        <th:block th:replace="~{etl-form/precheck :: card}"/>
    </div>

</div>
</th:block>

<th:block th:fragment="scripts" th:remove="tag"></th:block>
</body>
</html>
