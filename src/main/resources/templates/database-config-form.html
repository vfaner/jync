<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::scripts}, 'databases', 'db.edit')}">
<body>
<th:block th:fragment="content" th:remove="tag">
<div th:remove="tag">

    <div class="page-head">
        <div>
            <h1 th:text="${config.id != null} ? #{db.edit} : #{db.new}">New connection</h1>
            <p class="sub" th:text="#{db.formHint}">Test before saving to catch mistakes early</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-ghost btn-sm" th:href="@{/databases}">
                <svg class="ico"><use href="#arrow-left"/></svg><span th:text="#{common.back}">Back</span>
            </a>
        </div>
    </div>

    <div style="max-width:820px">
        <form method="post" id="db-form" th:action="@{/databases/save}" th:object="${config}">
            <input type="hidden" th:field="*{id}">

            <div class="card">
                <div class="card-head">
                    <h2><svg class="ico"><use href="#hdd-network"/></svg> <span th:text="#{db.connectionInfo}">Connection</span></h2>
                </div>
                <div class="card-body">
                    <div class="field">
                        <label>
                            <span th:text="#{db.role}">Purpose</span><span class="req">*</span>
                        </label>
                        <div class="role-group">
                            <label class="role-pick">
                                <input type="radio" th:field="*{role}" th:value="'SOURCE'" required>
                                <svg class="ico"><use href="#box-arrow-up-right"/></svg>
                                <span class="role-text">
                                    <strong th:text="#{db.role.source}">Source connection</strong>
                                    <span class="help" th:text="#{db.role.sourceHelp}">Data is read from here</span>
                                </span>
                            </label>
                            <label class="role-pick">
                                <input type="radio" th:field="*{role}" th:value="'TARGET'" required>
                                <svg class="ico"><use href="#box-arrow-in-down-left"/></svg>
                                <span class="role-text">
                                    <strong th:text="#{db.role.target}">Target connection</strong>
                                    <span class="help" th:text="#{db.role.targetHelp}">Data is written to here</span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="name">
                                <span th:text="#{common.name}">Name</span><span class="req">*</span>
                            </label>
                            <input type="text" class="input" id="name" th:field="*{name}" required maxlength="128">
                        </div>
                        <div class="field">
                            <label for="type">
                                <span th:text="#{common.type}">Type</span><span class="req">*</span>
                            </label>
                            <select class="select" id="type" th:field="*{type}" data-role="type-select"
                                    th:attr="data-action=@{/api/databases/type-defaults}">
                                <option th:each="t : ${types}" th:value="${t.name()}"
                                        th:text="#{${'db.type.' + t.name()}}">MySQL</option>
                            </select>
                            <div class="help mono" id="url-hint"
                                 th:text="${config.type != null ? config.type.urlTemplate : ''}"></div>
                        </div>
                    </div>

                    <div class="grid-3">
                        <div class="field" style="grid-column:span 2">
                            <label for="host" th:text="#{db.host}">Host</label>
                            <input type="text" class="input" id="host" th:field="*{host}" placeholder="localhost">
                        </div>
                        <div class="field">
                            <label for="port" th:text="#{db.port}">Port</label>
                            <!--/* 新建页服务端预填的默认端口必须打上自动填充标记，否则 app.js
                                    会把 3306 当成用户手填值，切换类型时拒绝覆盖；编辑页是已保存端口，不打标 */-->
                            <input type="number" class="input" id="port" th:field="*{port}"
                                   th:attr="data-autofilled=${config.id == null} ? 'true' : null">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="databaseName" th:text="#{db.databaseName}">Database</label>
                            <input type="text" class="input" id="databaseName" th:field="*{databaseName}">
                            <!--/* Oracle 的库名栏按服务名理解；只有 SID 的老库走自定义 URL。
                                    初始显隐由服务端按当前类型定，切换类型时 app.js 同步 */-->
                            <div class="help" id="oracle-name-help"
                                 th:attr="hidden=${config.type != null and config.type.name() == 'ORACLE'} ? null : 'hidden'"
                                 th:text="#{db.oracleNameHelp}">help</div>
                        </div>
                        <div class="field">
                            <label for="schemaName" th:text="#{db.schemaName}">Schema</label>
                            <input type="text" class="input" id="schemaName" th:field="*{schemaName}">
                            <div class="help" th:text="#{db.schemaNameHelp}">help</div>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="username" th:text="#{db.username}">User</label>
                            <input type="text" class="input" id="username" th:field="*{username}" autocomplete="off">
                        </div>
                        <div class="field">
                            <label for="rawPassword" th:text="#{db.password}">Password</label>
                            <!--/* 密码从不回填到浏览器；留空表示保留已存值 */-->
                            <input type="password" class="input" id="rawPassword" name="rawPassword"
                                   autocomplete="new-password">
                            <div class="help" th:if="${config.id != null}" th:text="#{db.passwordKeepHelp}">help</div>
                        </div>
                    </div>

                    <!--/* P0-2: Oracle CDB 挖掘账号——仅「源端 + Oracle」显示;目标库永远
                            不挖日志。首屏由服务端 hidden+disabled,切换类型/用途时 app.js
                            同步(与 custom-section 同纪律:隐藏必须连控件一起禁用,否则
                            残留值随其他类型提交) */-->
                    <div class="grid-2" id="miner-section"
                         th:attr="hidden=${config.type != null and config.type.name() == 'ORACLE' and config.role != null and config.role.name() == 'SOURCE'} ? null : 'hidden'">
                        <div class="field">
                            <label for="minerUsername" th:text="#{db.minerUsername}">Mining user</label>
                            <input type="text" class="input" id="minerUsername" th:field="*{minerUsername}"
                                   autocomplete="off"
                                   th:attr="disabled=${config.type != null and config.type.name() == 'ORACLE' and config.role != null and config.role.name() == 'SOURCE'} ? null : 'disabled'">
                            <div class="help" th:text="#{db.minerUsernameHelp}">help</div>
                        </div>
                        <div class="field">
                            <label for="rawMinerPassword" th:text="#{db.minerPassword}">Mining password</label>
                            <!--/* 与主密码同约定:从不回填,留空保留已存值 */-->
                            <input type="password" class="input" id="rawMinerPassword" name="rawMinerPassword"
                                   autocomplete="new-password"
                                   th:attr="disabled=${config.type != null and config.type.name() == 'ORACLE' and config.role != null and config.role.name() == 'SOURCE'} ? null : 'disabled'">
                            <div class="help" th:if="${config.id != null}" th:text="#{db.passwordKeepHelp}">help</div>
                        </div>
                    </div>

                    <div class="field">
                        <label for="extraParams" th:text="#{db.extraParams}">Extra params</label>
                        <input type="text" class="input mono" id="extraParams" th:field="*{extraParams}">
                        <div class="help" th:text="#{db.extraParamsHelp}">help</div>
                    </div>
                </div>
            </div>

            <!--/* 驱动卡片对每种类型都渲染:GoldenDB/TiDB 等复用内置驱动的预设,也可能
                    被厂商要求使用专属 URL / jar / 驱动类(例如 com.goldendb.jdbc.Driver
                    与 jdbc:goldendb://)。内置驱动的预设默认锁住三个覆盖控件,由「使用厂商
                    自带驱动」开关展开;外部驱动预设(CUSTOM / GaussDB / GBase / 神通)必填,
                    开关隐藏、控件常开。首屏由服务端决定,切换类型时 app.js 同步。

                    隐藏不等于不提交:hidden 或收起时必须连控件一起禁用,否则残留的 URL
                    会覆盖预设模板、残留的 jar 路径会劫持内置驱动。 */-->
            <div class="card" id="jar-card"
                 th:attr="hidden=${driverCardAvailable} ? null : 'hidden',
                          data-required=${driverCardRequired} ? 'true' : 'false'">
                <div class="card-head">
                    <h2><svg class="ico"><use href="#database"/></svg> <span th:text="#{db.jarCard}">Driver settings</span></h2>
                    <div class="card-head-tools">
                        <span class="hint"
                              th:text="${driverCardRequired} ? #{db.jarCardHint} : #{db.jarCardHintOptional}">hint</span>
                        <!--/* 开关放在卡片头部:打开后才展开下面的三个覆盖字段。必填的预设
                                (CUSTOM / 未内置驱动)没有开关,字段直接展开。 */-->
                        <label class="switch" th:if="${!driverCardRequired}">
                            <input type="checkbox" id="vendor-driver-toggle" data-role="vendor-driver-toggle"
                                   th:checked="${driverCardEnabled}">
                            <span class="track"></span>
                            <span class="switch-text"><strong th:text="#{db.vendorDriver}">Vendor driver</strong></span>
                        </label>
                    </div>
                </div>
                <div class="card-body" id="driver-card-body"
                     th:attr="hidden=${driverCardEnabled} ? null : 'hidden'">
                    <div class="help" th:text="#{db.vendorDriverHelp}">help</div>
                    <div class="field">
                        <!--/* URL 覆盖对所有类型都有意义(厂商驱动通常只认自家前缀),所以放在
                                这里而不是 CUSTOM 区块;同一表单只有这一个 customUrl 控件。 */-->
                        <label for="customUrl" th:text="#{db.customUrl}">JDBC URL</label>
                        <input type="text" class="input mono" id="customUrl" th:field="*{customUrl}"
                               placeholder="jdbc:other://host:5236/DBNAME"
                               th:disabled="${driverCardEnabled} ? null : 'disabled'">
                        <div class="help" th:text="#{db.customUrlHelp}">help</div>
                    </div>
                    <div class="field">
                        <label for="customJarPath" th:text="#{db.customJarPath}">Driver jar path</label>
                        <div class="input-group">
                            <input type="text" class="input mono" id="customJarPath" th:field="*{customJarPath}"
                                   placeholder="/opt/drivers/gbase-jdbc.jar"
                                   th:disabled="${driverCardEnabled} ? null : 'disabled'">
                            <button type="button" class="btn btn-ghost" data-role="find-drivers"
                                    th:attr="data-action=@{/api/databases/discover-drivers}"
                                    th:disabled="${driverCardEnabled} ? null : 'disabled'">
                                <svg class="ico"><use href="#search"/></svg>
                                <span th:text="#{db.discoverDrivers}">Detect</span>
                            </button>
                        </div>
                        <div class="help" th:text="#{db.customJarPathHelp}">help</div>
                    </div>
                    <div class="field">
                        <!--/* 驱动类属于 jar:厂商 jar 里的类名常与预设不同(GaussDB 的
                                gsjdbc200.jar 是 com.huawei.gauss200.jdbc.Driver)。留空即用
                                预设类,提示行显示的就是它。控件随开关一起禁用,残留值不提交。 */-->
                        <label for="customDriver" th:text="#{db.customDriver}">Driver class</label>
                        <input type="text" class="input mono" id="customDriver" th:field="*{customDriver}"
                               list="driver-options" placeholder="com.example.jdbc.Driver"
                               th:disabled="${driverCardEnabled} ? null : 'disabled'">
                        <datalist id="driver-options"></datalist>
                        <div class="help mono" id="driver-hint"
                             th:text="${config.type != null ? config.type.driverClassName : ''}"></div>
                        <div class="help" th:text="#{db.customDriverHelp}">help</div>
                    </div>
                </div>
            </div>

            <!--/* CUSTOM 的 URL 与驱动在上面的驱动卡片里;这里只声明 SQL 方言家族 */-->
            <div class="card" id="custom-section"
                 th:attr="hidden=${config.type != null and config.type.name() == 'CUSTOM'} ? null : 'hidden'">
                <div class="card-head">
                    <h2><svg class="ico"><use href="#puzzle"/></svg> <span th:text="#{db.customSection}">Custom connection</span></h2>
                    <span class="hint" th:text="#{db.customHint}">hint</span>
                </div>
                <div class="card-body">
                    <!--/* 自定义 JDBC URL 看不出产品语法;方言家族决定生成哪种 upsert/DDL */-->
                    <div class="field">
                        <label for="dialectFamily" th:text="#{db.dialectFamily}">SQL dialect</label>
                        <select class="select" id="dialectFamily" th:field="*{dialectFamily}"
                                th:disabled="${config.type != null and config.type.name() == 'CUSTOM'} ? null : 'disabled'">
                            <option th:each="f : ${families}" th:value="${f.name()}"
                                    th:text="#{${'db.family.' + f.name()}}">Generic</option>
                        </select>
                        <div class="help" th:text="#{db.dialectFamilyHelp}">help</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body btn-row">
                    <button type="submit" class="btn btn-primary">
                        <svg class="ico"><use href="#check-lg"/></svg><span th:text="#{common.save}">Save</span>
                    </button>
                    <!--/* 直接用表单当前值测试，不必先保存 */-->
                    <button type="button" class="btn btn-ghost" data-role="test-conn" data-form="db-form"
                            th:attr="data-action=@{/api/databases/test},data-busy-text=#{db.testing}">
                        <svg class="ico"><use href="#plug"/></svg><span th:text="#{common.test}">Test</span>
                    </button>
                    <a class="btn btn-ghost" th:href="@{/databases}" th:text="#{common.cancel}">Cancel</a>
                </div>
            </div>

            <div id="test-result" class="alert" hidden></div>
        </form>
    </div>

</div>
</th:block>

<th:block th:fragment="scripts" th:remove="tag"></th:block>
</body>
</html>
