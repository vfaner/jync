<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* AI 运维助手：右下角悬浮入口 + 抽屉式对话面板。所有文案、工具名与提交地址
       由服务端渲染进 data-*，脚本里不出现任何中文/英文界面文案。 */-->
<th:block th:fragment="widget">
<div id="support-widget" class="support-widget"
     th:data-action="@{/api/support/chat}"
     th:data-action-url="@{/api/support/action}"
     th:data-run-url="@{/api/support/runs}"
     th:data-draft-url="@{/projects/new}"
     th:data-label-confirm="#{support.action.confirm}"
     th:data-label-cancel="#{support.action.cancel}"
     th:data-label-cancelled="#{support.action.cancelled}"
     th:data-label-target="#{support.action.field.target}"
     th:data-label-thinking="#{support.thinking}"
     th:data-label-timeout="#{support.timeout}"
     th:data-label-disabled="#{support.disabled}"
     th:data-label-busy="#{support.busy}"
     th:data-label-used="#{support.draft.used}"
     th:data-label-open="#{support.draft.open}"
     th:data-label-restore="#{support.restore}"
     th:data-label-greeting="#{support.greeting}"
     th:data-label-network="#{error.network}"
     th:data-label-step-queued="#{support.tool.state.queued}"
     th:data-label-step-running="#{support.tool.state.running}"
     th:data-label-step-done="#{support.tool.state.done}"
     th:data-label-step-failed="#{support.tool.state.failed}"
     th:data-tool-list_projects="#{support.tool.list_projects}"
     th:data-tool-project_status="#{support.tool.project_status}"
     th:data-tool-project_table_status="#{support.tool.project_table_status}"
     th:data-tool-update_project_params="#{support.tool.update_project_params}"
     th:data-tool-update_project_cursor="#{support.tool.update_project_cursor}"
     th:data-tool-update_project_schedule="#{support.tool.update_project_schedule}"
     th:data-tool-update_connection_params="#{support.tool.update_connection_params}"
     th:data-tool-connection_details="#{support.tool.connection_details}"
     th:data-tool-system_params="#{support.tool.system_params}"
     th:data-tool-update_system_params="#{support.tool.update_system_params}"
     th:data-tool-project_row_count="#{support.tool.project_row_count}"
     th:data-tool-database_metrics="#{support.tool.database_metrics}"
     th:data-tool-list_connections="#{support.tool.list_connections}"
     th:data-tool-search_docs="#{support.tool.search_docs}"
     th:data-tool-cdc_status="#{support.tool.cdc_status}"
     th:data-tool-cdc_probe="#{support.tool.cdc_probe}"
     th:data-tool-alerts="#{support.tool.alerts}"
     th:data-tool-recent_failures="#{support.tool.recent_failures}"
     th:data-tool-diagnose_project="#{support.tool.diagnose_project}"
     th:data-tool-etl_status="#{support.tool.etl_status}"
     th:data-tool-control_project="#{support.tool.control_project}"
     th:data-tool-control_etl_task="#{support.tool.control_etl_task}"
     th:data-tool-diagnose_etl_task="#{support.tool.diagnose_etl_task}"
     th:data-tool-list_migrations="#{support.tool.list_migrations}"
     th:data-tool-diagnose_migration="#{support.tool.diagnose_migration}"
     th:data-tool-control_migration="#{support.tool.control_migration}"
     th:data-tool-draft_project="#{support.tool.draft_project}">

  <button type="button" class="support-fab" data-role="support-toggle"
          th:aria-label="#{support.open}" th:title="#{support.open}">
    <svg class="ico"><use href="#chat-dots"/></svg>
  </button>

  <section class="support-panel" data-role="support-panel" hidden
           th:aria-label="#{support.title}">
    <header class="support-head" data-role="support-drag">
      <span class="support-title">
        <svg class="ico"><use href="#chat-dots"/></svg>
        <span th:text="#{support.title}">AI assistant</span>
      </span>
      <span class="support-actions">
        <button type="button" class="support-icon-btn" data-role="support-new"
                th:aria-label="#{support.newSession}" th:title="#{support.newSession}">
          <svg class="ico"><use href="#plus-lg"/></svg>
        </button>
        <button type="button" class="support-icon-btn" data-role="support-max"
                th:aria-label="#{support.maximize}" th:title="#{support.maximize}">
          <svg class="ico"><use href="#arrows-angle-expand"/></svg>
        </button>
        <button type="button" class="support-icon-btn" data-role="support-close"
                th:aria-label="#{support.close}" th:title="#{support.close}">
          <svg class="ico"><use href="#x-lg"/></svg>
        </button>
      </span>
    </header>

    <div class="support-log" data-role="support-log" aria-live="polite"></div>

    <form class="support-form" data-role="support-form">
      <textarea class="support-input" data-role="support-input" rows="1" maxlength="20000"
                th:placeholder="#{support.input.placeholder}"></textarea>
      <button type="submit" class="support-send" data-role="support-send"
              th:aria-label="#{support.send}" th:title="#{support.send}">
        <svg class="ico"><use href="#send"/></svg>
      </button>
    </form>

    <span class="support-resize" data-role="support-resize" aria-hidden="true"></span>
  </section>
</div>
</th:block>
</body>
</html>
