<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::scripts}, 'system-logs', 'syslog.title')}">
<body>
<th:block th:fragment="content" th:remove="tag">
<div th:remove="tag">

    <div class="page-head">
        <div>
            <h1 th:text="#{syslog.title}">System log</h1>
            <p class="sub" th:text="#{syslog.subtitle}">Inspect this application's own runtime log.</p>
        </div>
        <div class="page-actions">
            <button type="button" class="btn btn-ghost btn-warn" th:if="${isAdmin}"
                    data-open-modal="log-purge-modal">
                <svg class="ico"><use href="#trash"/></svg><span th:text="#{log.purge}">Delete by date</span></button>
        </div>
    </div>

    <!--/* 只删已滚动的历史归档（文件名带日期），正在写入的 jync.log 与 .tmp 不碰；
           保留期由 logging.logback.rollingpolicy.max-history 自动兜底。 */-->
    <div class="modal" id="log-purge-modal" aria-hidden="true" role="dialog" aria-modal="true"
         th:if="${isAdmin}" th:attr="data-purge-url=@{/system-logs/purge}">
        <div class="modal-mask" data-close-modal="log-purge-modal"></div>
        <div class="modal-dialog" style="max-width:460px">
            <button type="button" class="modal-close" data-close-modal="log-purge-modal"
                    th:aria-label="#{common.cancel}">×</button>
            <div class="modal-head">
                <h3 th:text="#{log.purge.title}">Delete logs</h3>
            </div>
            <div class="preview-body" style="text-align:left;border:none;">
                <p class="help small muted" th:text="#{log.purge.hint}">Deletes records on or
                    before the selected date; today is always kept.</p>
                <p class="help small muted" th:text="#{log.purge.sysHint}">Only rolled archive
                    files are deleted; the live log is untouched.</p>
                <div class="field">
                    <label for="purge-date" th:text="#{log.purge.date}">Cutoff date</label>
                    <div class="date-field" data-role="date-field">
                        <input type="text" id="purge-date" class="input date-input"
                               data-role="purge-date" readonly autocomplete="off"
                               th:max="${purgeMaxDate}"
                               th:placeholder="#{log.purge.date.placeholder}">
                        <svg class="ico date-ico" aria-hidden="true"><use href="#calendar"/></svg>
                        <div class="date-pop" data-role="date-pop" hidden></div>
                    </div>
                </div>
                <div class="purge-quick">
                    <button type="button" class="chip-btn" data-purge-days="7"
                            th:text="#{log.purge.quick(7)}">7 days ago</button>
                    <button type="button" class="chip-btn" data-purge-days="30"
                            th:text="#{log.purge.quick(30)}">30 days ago</button>
                    <button type="button" class="chip-btn" data-purge-days="90"
                            th:text="#{log.purge.quick(90)}">90 days ago</button>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost btn-sm"
                        data-close-modal="log-purge-modal" th:text="#{common.cancel}">Cancel</button>
                <button type="button" class="btn btn-warn btn-sm" data-role="purge-confirm"
                        th:text="#{log.purge.confirm}">Delete</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="get" th:action="@{/system-logs}" class="inline-form">
                <!--/* 只列出服务端认可的文件名；未知名字会被服务拒掉并回一条错误，
                       所以这里不需要放「全部文件」之类的自由输入。 */-->
                <select class="select" name="file" style="min-width:230px"
                        th:aria-label="#{syslog.file}">
                    <option th:each="f : ${files}" th:value="${f.name}"
                            th:selected="${f.name == selectedFile}"
                            th:text="${f.name}">jync.log</option>
                </select>
                <select class="select" name="level" th:aria-label="#{syslog.level}">
                    <option th:each="lvl : ${levels}" th:value="${lvl}"
                            th:selected="${lvl == level}"
                            th:text="#{${'syslog.level.' + lvl}}">All</option>
                </select>
                <input type="text" class="input" name="q" style="min-width:220px"
                       th:value="${keyword}"
                       th:placeholder="#{syslog.keywordPlaceholder}"
                       th:aria-label="#{syslog.keyword}">
                <button type="submit" class="btn btn-primary btn-sm">
                    <svg class="ico"><use href="#search"/></svg>
                    <span th:text="#{syslog.search}">Search</span>
                </button>
            </form>

            <div class="log-meta" th:if="${result.errorKey == null}">
                <span th:text="#{syslog.matched(${result.matched})}">0 matching lines</span>
                <span th:if="${result.truncated}" th:text="#{syslog.truncated}">Truncated.</span>
            </div>

            <div th:if="${result.errorKey != null}" class="alert alert-danger">
                <svg class="ico"><use href="#exclamation-triangle-fill"/></svg>
                <div class="alert-body" th:text="${#messages.msg(result.errorKey)}">Unavailable</div>
            </div>

            <div th:if="${result.errorKey == null and result.lines.isEmpty()}" class="empty">
                <div class="empty-ico"><svg class="ico"><use href="#code-square"/></svg></div>
                <h3 th:text="#{syslog.empty}">No matching log lines.</h3>
            </div>

            <!--/* 行内容由服务端逐段转义后再插入关键字 <mark>，所以这里必须用 utext：
                   用 text 会把标记也转义成可见字符。 */-->
            <div class="log-panel" th:if="${result.errorKey == null and !result.lines.isEmpty()}">
                <div class="log-line" th:each="line : ${result.lines}" th:utext="${line}"></div>
            </div>
        </div>
    </div>

</div>
</th:block>

<th:block th:fragment="scripts" th:remove="tag"></th:block>
</body>
</html>
