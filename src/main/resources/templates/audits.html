<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::scripts}, 'audits', 'audit.title')}">
<body>
<th:block th:fragment="content" th:remove="tag">
<div th:remove="tag">

    <div class="page-head">
        <div>
            <h1 th:text="#{audit.title}">Audit log</h1>
            <p class="sub">
                <span th:text="${pager.totalItems}">0</span>
                <span th:text="#{audit.entries}">entries</span>
            </p>
        </div>
        <!--/* 默认只增不删；管理员可按日期选择性清理（含所选当天、永远留下今天），
               清理动作本身会再记一条审计，所以痕迹删不掉。 */-->
        <div class="page-actions">
            <button type="button" class="btn btn-ghost btn-warn" th:if="${isAdmin}"
                    data-open-modal="log-purge-modal">
                <svg class="ico"><use href="#trash"/></svg><span th:text="#{log.purge}">Delete by date</span></button>
        </div>
    </div>

    <div class="modal" id="log-purge-modal" aria-hidden="true" role="dialog" aria-modal="true"
         th:if="${isAdmin}" th:attr="data-purge-url=@{/audits/purge}">
        <div class="modal-mask" data-close-modal="log-purge-modal"></div>
        <div class="modal-dialog" style="max-width:460px">
            <button type="button" class="modal-close" data-close-modal="log-purge-modal"
                    th:aria-label="#{common.cancel}">×</button>
            <div class="modal-head">
                <h3 th:text="#{log.purge.title}">Delete logs</h3>
            </div>
            <div class="preview-body" style="text-align:left;border:none;">
                <p class="help small muted" th:text="#{log.purge.hint}">Deletes records on or
                    before the selected date; today is always kept.</p>
                <p class="help small muted" th:text="#{audit.purge.hint}">The purge itself is
                    recorded as a new audit event.</p>
                <div class="field">
                    <label for="purge-date" th:text="#{log.purge.date}">Cutoff date</label>
                    <div class="date-field" data-role="date-field">
                        <input type="text" id="purge-date" class="input date-input"
                               data-role="purge-date" readonly autocomplete="off"
                               th:max="${purgeMaxDate}"
                               th:placeholder="#{log.purge.date.placeholder}">
                        <svg class="ico date-ico" aria-hidden="true"><use href="#calendar"/></svg>
                        <div class="date-pop" data-role="date-pop" hidden></div>
                    </div>
                </div>
                <div class="purge-quick">
                    <button type="button" class="chip-btn" data-purge-days="7"
                            th:text="#{log.purge.quick(7)}">7 days ago</button>
                    <button type="button" class="chip-btn" data-purge-days="30"
                            th:text="#{log.purge.quick(30)}">30 days ago</button>
                    <button type="button" class="chip-btn" data-purge-days="90"
                            th:text="#{log.purge.quick(90)}">90 days ago</button>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost btn-sm"
                        data-close-modal="log-purge-modal" th:text="#{common.cancel}">Cancel</button>
                <button type="button" class="btn btn-warn btn-sm" data-role="purge-confirm"
                        th:text="#{log.purge.confirm}">Delete</button>
            </div>
        </div>
    </div>

    <div class="card" th:with="pagerBase=@{/audits}">
        <div class="card-body tight">
            <div th:if="${events.totalElements == 0}" class="empty">
                <div class="empty-ico"><svg class="ico"><use href="#shield-check"/></svg></div>
                <h3 th:text="#{audit.empty}">Nothing recorded yet.</h3>
            </div>

            <div th:unless="${events.totalElements == 0}" class="tbl-wrap">
                <table class="tbl dense">
                    <thead>
                    <tr>
                        <th th:text="#{audit.occurredAt}">Time</th>
                        <th th:text="#{audit.actor}">User</th>
                        <th th:text="#{audit.action}">Action</th>
                        <th th:text="#{common.details}">Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="e : ${events.content}" th:with="an=${e.action.name()}">
                        <td class="small mono" style="white-space:nowrap"
                            th:text="${#temporals.format(e.occurredAt, 'yyyy-MM-dd HH:mm:ss')}">time</td>
                        <td class="mono small" th:text="${e.actor}">actor</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${an == 'LOGIN_FAILED'} ? 'badge-danger'
                                                : (${an == 'LOGIN'} ? 'badge-ok'
                                                : (${an == 'PROJECT_DELETE' or an == 'DB_DELETE'
                                                   or an == 'CHANGELOG_CLEAR' or an == 'PROJECT_FORCE_UNLOCK'}
                                                   ? 'badge-warn' : 'badge-mute'))"
                                  th:text="#{'audit.action.' + ${an}}">Action</span>
                        </td>
                        <td><div class="wrap-detail muted" th:text="${details[e.id] ?: ''}">detail</div></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:replace="~{fragments/pager :: pager(${pager}, ${pagerBase})}"></div>
    </div>

    <p class="small muted" style="margin:11px 0 0" th:text="#{audit.help}">Append-only help</p>

</div>
</th:block>

<th:block th:fragment="scripts" th:remove="tag"></th:block>
</body>
</html>
