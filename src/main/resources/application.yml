spring:
  application:
    name: jync
  datasource:
    # AUTO_SERVER lets an external tool inspect the store while the app runs.
    # H2 2.x rejects combining it with DB_CLOSE_ON_EXIT, so that flag is omitted.
    # Upgrades from SyncTool (<= 1.2.x): LegacyStoreMigration renames a synctool.mv.db
    # sitting next to the effective store path, so no data is lost. A deployment whose
    # overridden URL still names .../synctool keeps using that exact file, untouched.
    url: jdbc:h2:file:./data/jync;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: jync-meta
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Hibernate 6+ maps Instant to TIMESTAMP WITH TIME ZONE by default, which changes
          # the stored column type. Pinning the legacy TIMESTAMP mapping keeps the 2.7 schema
          # and query semantics on every supported metadata store.
          preferred_instant_jdbc_type: TIMESTAMP
        query:
          native:
            # Any native datetime scalar otherwise comes back as LocalDateTime, which drops
            # the UTC conversion jdbc.time_zone applies. No production query returns one today;
            # the setting keeps that behaviour from silently returning with a future native
            # query (the change-log charts now group with portable HQL calendar functions).
            prefer_jdbc_datetime_types: true
  servlet:
    multipart:
      # 配置包上限 20 MB（ConfigPackageFormat.MAX_PACKAGE_BYTES 是唯一语义来源，
      # ConfigPackageController 在读字节前再校验一次）。请求上限多留 2 MB 给表单字段。
      max-file-size: 20MB
      max-request-size: 22MB
  thymeleaf:
    encoding: UTF-8
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    resources:
      cache:
        # 保持 0 是有意的：发布走"同版本覆盖"（v1.3.1 被重传过多次），URL 上的
        # v=${appVersion} 参数在覆盖后不变，长缓存期会让浏览器拿着旧 app.js 不放。
        # 0 = 每次都带条件请求，未变返回 304，代价只是一次往返。
        period: 0
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: jync-scheduler
      org.quartz.threadPool.threadCount: "10"
  task:
    scheduling:
      pool:
        # Spring 默认只有 1 个调度线程。CDC 巡检 (supervise) 会同步建连/等待线程退出,
        # 一次慢网络就能把后面的日志清理和任务对账整轮推迟;给三个 @Scheduled 任务
        # 各自留出线程。
        size: 4
  h2:
    console:
      enabled: false

server:
  port: 8080
  tomcat:
    # 对象选择面板：上万张表全选时，表单体可能超过容器默认的 2 MB —— URL 编码把
    # 中文表名放大到 9 字节/字，而每张已勾选的表会提交 tables、mappingSource、
    # mappingTarget 三个字段。参数个数上限见 FormParameterLimitConfig。
    max-http-form-post-size: 8MB
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        http-only: true
        # Lax lets top-level navigations carry the cookie but blocks CSRF-prone cross-site posts.
        # Embedding Jync in an iframe needs None, together with HTTPS and JYN_COOKIE_SECURE=true.
        same-site: ${JYN_COOKIE_SAME_SITE:lax}
        # HTTPS deployments should set JYN_COOKIE_SECURE=true; left overridable so a plain
        # http://localhost deployment keeps working out of the box.
        secure: ${JYN_COOKIE_SECURE:false}

metrics:
  # Prometheus scrape endpoint at /api/metrics/prometheus. The endpoint is closed while this
  # token is blank; set it (JYN_METRICS_TOKEN) to allow a scraper to read it:
  #   authorization: {type: Bearer, credentials: <token>}
  # The token is the only gate — scrapers cannot hold a Jync session.
  prometheus-token: ${JYN_METRICS_TOKEN:}

app:
  # The banner reads this; @project.version@ is filtered from pom.xml at build time,
  # so the startup banner follows the POM without a second place to edit.
  version: @project.version@
  login:
    # 应急开关：关闭本地登录后如果外部认证不可用，以 JYN_RESET_LOGIN=true 启动一次，
    # 就会把本地登录重新打开并保存；修好外部配置后去掉该变量并重启。
    # 平时保持 false，它不参与登录方式的分流。
    reset-on-startup: ${JYN_RESET_LOGIN:false}
  # Repository link behind the nav GitHub icon and the donate dialog buttons.
  github-url: https://github.com/vfaner/jync
  # 设置页「项目与作者」栏：Gitee 镜像地址、官网与作者联系方式，留空则对应行不显示。
  # 多个 QQ 号可用 / 、英文逗号或空格分隔，页面自动拆成独立行并生成 tencent:// 唤起会话链接。
  gitee-url: https://gitee.com/super_rgh/jync
  site-url: https://jync.qqmu.com
  contact-qq: 817094/2912167928
  contact-qq-group: 426669837
  contact-email: vfaner@88.com
  contact-wechat: qqmu66
  # 设置页的新版本检查，有两条路径：
  #   1) 版本卡的后台检查：GitHub 优先，失败/超时自动改查 Gitee（app.gitee-url）；
  #      成功结果缓存 10 分钟、失败缓存 1 分钟，过期后台重试。
  #   2) 管理员页面的同步检查：GitHub 优先，超时无结果再查 Gitee，两边都失败就静默。
  #      登录后第一次加载查一次，结果放进 sessionStorage，翻到其他菜单时圆点保留；
  #      进入系统信息页再强制查一次。版本更高时点亮「系统信息」右上角的黄色圆点。
  # 纯内网两个平台都访问不了时建议关闭（一键升级入口与右上角提示都会消失）。
  update-check:
    enabled: true
    # 单次请求超时（毫秒）：任一平台超过这个时长仍无结果即改查另一平台
    timeout-ms: 5000
    # 版本号相同也要比对安装包：GitHub 用制品 digest，Gitee 退化为 HEAD 取 Content-Length。
    # 只有「证明不同」才提示；证明不了（Gitee 无摘要、HEAD 失败、IDE 里跑 class 目录）
    # 一律当作已是最新，不会误报。发布方重新上传同名 tag 的 jar 时靠它提醒升级。
    match-artifact: true
  security:
    # 反向代理地址（逗号分隔，支持 IPv4/IPv6 CIDR），回环地址总是信任。
    # 只有这里列出的机器发来的 X-Forwarded-For / X-Real-IP 才会被采信；留空表示没有代理。
    # 「外部认证 → 网关头」模式也用它判定可信来源：只有直接 TCP 对端在这个列表（或回环）内，
    # 请求里的身份头才会生效。Jync 必须部署在网关之后，不能直连暴露。
    # 曾经把"私网直连"当作代理，导致同网段客户端可以每次伪造不同 IP，绕过登录锁定并污染审计。
    trusted-proxies: ${JYN_TRUSTED_PROXIES:}
    # 强制 HTTPS：非 TLS 请求返回 403。默认关闭——常规部署由前置反向代理终止 TLS，
    # 打开时必须把代理地址写进 trusted-proxies，否则代理转发来的请求会被当成明文拒绝。
    # 两个例外：回环地址（本机运维与探针）、不带 Cookie 的 GET /login（容器健康探针；
    # 登录 POST 永远不放行，密码不会明文过网）。直接暴露 8080 的部署不要打开。
    #
    # 留空（默认）表示由「系统管理 → 系统配置」页面决定，改完即时生效、无需重启。
    # 这里或 JYN_REQUIRE_HTTPS 一旦显式赋值（true/false/on/off/yes/no/1/0），
    # 即以配置为准，页面变为只读——环境变量拼错会在启动时直接失败，而不是悄悄关掉防护。
    require-https: ${JYN_REQUIRE_HTTPS:}
  # 应用内 TLS（可选）：「系统管理 → 系统配置」上传 PKCS#12 / JKS 后，由 Jync 自己监听
  # HTTPS，浏览器直连、不经过反向代理。证书与口令存在数据目录下的 tls.directory，
  # **不在**元数据库、也不进「配置包」——备份数据卷时要把它一起带上。
  # 连接器在启动时创建，保存/删除证书后必须重启才生效。
  tls:
    # 逃生口：设为 false 时不读取证书、不添加 HTTPS 连接器。证书损坏或 HTTPS 端口被占
    # 导致启动失败时，用它启动一次进页面重新上传或删除。
    enabled: ${JYN_TLS_ENABLED:true}
    # 密钥库文件与 tls.properties 边车的存放目录（相对工作目录）。口令在边车里用 sync.crypto-* 加密。
    directory: ${JYN_TLS_DIRECTORY:./data/tls}
    # HTTP→HTTPS 307 重定向的目标主机名（如 jync.example.com）。留空表示用请求的 Host。
    # 只在已加载证书、且上传时勾选了「重定向 HTTP」后才重定向；非法 Host 直接返回 400。
    redirect-host: ${JYN_TLS_REDIRECT_HOST:}

sync:
  # Default polling interval in milliseconds for change detection
  poll-interval: 2000
  # Max retry attempts for a failed sync unit before it is logged as an error
  max-retries: 3
  # JDBC batch size for incremental windows and CDC replay (live traffic; keep it small)
  batch-size: 500
  # Fetch size hint applied to incremental source result sets
  fetch-size: 1000
  # Rows per JDBC batch of the initial/full load only. Independent of batch-size: a full load
  # has no live traffic to protect, so fewer/larger commits are safe there. Clamped to 20000.
  full-load-batch-size: 2000
  # Cursor fetch size of the initial/full load only. Clamped to 20000.
  full-load-fetch-size: 2000
  # Initial load into an EMPTY Oracle / MySQL / PostgreSQL target writes plain INSERT instead
  # of the upsert (on Oracle this measured ~2.5x faster: nothing can match on an empty table,
  # so the match test buys nothing). The target is probed once per table load; a table that
  # already has rows keeps the idempotent upsert, and so does a table whose unique indexes go
  # beyond the primary key: a plain INSERT would abort the batch on the second row when the
  # source repeats a business key under a different primary key. Other targets are unaffected.
  # The former key sync.oracle-initial-load-insert-first is still accepted as an alias.
  initial-load-insert-first: true
  # A newly created table's non-unique secondary indexes are built AFTER its initial load,
  # not while the rows arrive: maintaining them per row roughly doubled the load in the
  # 500k-row Oracle benchmark (11.1s vs 5.9s), while creating both afterwards took 0.5s.
  # The primary key (inside CREATE TABLE) and unique indexes are always created immediately:
  # the upsert needs the PK, and a unique index must catch duplicate source rows as they
  # arrive. Structure-only projects (no data load) still create every index up front.
  defer-secondary-indexes: true
  # Rows per keyset chunk of an initial full load; each chunk commits and checkpoints on its
  # own, so a crash mid-table resumes at the last chunk instead of re-reading everything.
  # 0 disables chunking (classic single streamed read). Keyless tables use this as the OFFSET
  # page size when the target is empty and at least one column can be ordered; a resumed load
  # continues from the target's row count.
  chunk-size: 100000
  # Worker threads for one chunked initial full load. Requires a single-column integer primary
  # key (MIN/MAX range split); other tables stay sequential. Workers borrow their own
  # connections per chunk, so parallelism above max-pool-size just queues on the pool. Clamped
  # to 8, and further capped by the pool: max-pool-size - 1 for distinct endpoints,
  # (max-pool-size - 2) / 2 when source and target share one database config. 同一连接配置上
  # 有多个任务同时跑时按活跃任务数均分剩余席位(见 PoolActivity), 保证总连接数不超池。 A project may
  # override it (full-load performance card). Default 2 is balanced: the 500k-row Oracle
  # benchmark measured ~117k rows/s at 1, ~184k at 2 and ~216k at 4 (+18% for the last step).
  # Set 1 on databases that are shared with live traffic.
  full-load-parallelism: 2
  # Maximum connections in each per-database pool; a cycle borrows one connection per side.
  # 多个任务共用同一连接配置时, 需满足: max-pool-size ≥ 1 + Σ 各任务并行度 + 1~2 余量。
  # 若小于实际需求, 争抢的轮次会排队(pool-wait-ms)后退让, 不再直接报错。
  max-pool-size: 5
  # 同一连接配置被两个任务共用时, 池被一个并行满载的加载占满, 另一个任务等这么久再退让:
  # 本轮不记失败也不记结果, 到下一个调度周期重试。0 = 池一满就退让。
  pool-wait-ms: 10000
  # Subtracted from the timestamp high-watermark so in-flight source transactions
  # that commit slightly out of clock order are not skipped. See SyncProperties.
  safety-lag-ms: 1000
  # How often, at most, to re-count both sides of a table and confirm the target still
  # holds every row the cursor claims to have delivered. Set to 0 to disable.
  # Costs one COUNT(*) per side per table, hence the throttle.
  row-count-audit-interval-ms: 60000
  # Content audit: sample keys across the synced range and compare the projected values on
  # both sides, catching rows whose count is right but whose content differs. 0 disables it.
  content-audit-interval-ms: 900000
  # Keys sampled per audit (clamped to 2..200); each one costs one point lookup on each side.
  content-audit-sample-size: 50
  # Tables whose source row estimate exceeds this are skipped (0 removes the ceiling).
  content-audit-max-rows: 2000000
  # Tables audited per sync cycle; 0 removes the cap.
  content-audit-max-tables-per-cycle: 1
  content-audit-timeout-seconds: 60
  # Largest drift the audit repairs by key (walk the audited key range, upsert only the
  # missing rows, keep the cursor) before falling back to clearing the cursor and
  # reloading the whole table. 0 disables the targeted repair. A shortfall this small
  # means a backfilled row or two; a wider gap means the table needs rebuilding anyway.
  row-count-repair-max-rows: 1000
  # Row count ceiling under which a table with no usable cursor column is
  # synchronized by full comparison instead of being skipped
  full-compare-max-rows: 20000
  # Row count ceiling for chunked deletion comparison (0 = off). Above
  # full-compare-max-rows the keys no longer fit in memory; with this raised, a table
  # is compared one page of target keys at a time instead of being skipped. Cost: one
  # full scan of the target plus one source lookup per key, every cycle.
  delete-compare-max-rows: 0
  # TTL for the per-project sync lock; a crashed node's lock expires after this
  lock-ttl-ms: 300000
  # A polling cycle with no progress for this long is reported as wedged. Until it returns,
  # Quartz skips every later fire of that project (the page shows a next-run time that has
  # already passed); waiting does not recover it, a restart does. 0 disables the warning.
  # Above ten lock TTLs (50 min by default) the log warning never fires: the watchdog stops
  # renewing there, so no tick reaches the threshold. The page hint is unaffected.
  stuck-threshold-ms: 1800000
  # 多实例控制面：每个节点定期把本地 Quartz 调度与数据库里的 enabled 标志对账，
  # 别的节点上启动/停用的项目最多经过一个间隔就会在本节点生效。单实例部署时
  # 对账始终无差异，纯属保险。
  reconcile-interval-ms: 30000
  # Statement timeout for data-plane queries; a lock wait or a dead socket otherwise parks the
  # worker forever. 0 disables. Metadata enumeration uses the shorter metadata-query-timeout.
  query-timeout-seconds: 300
  # The row copy (window SELECT and high-watermark MAX) scales with the table, so it has its
  # own budget: under the 5-minute statement bound a large copy is cancelled, and on MySQL
  # Connector/J that also makes HikariCP evict the connection ("Connection is closed" for
  # every later table of the cycle). 0 removes the bound.
  copy-timeout-seconds: 1800
  # Bookkeeping COUNT(*) probes (the NULL-cursor check and the row-count audit) stop running
  # once a table passes this size with no index leading with the cursor column: the same
  # statement then scans the whole table every cycle. The same ceiling decides when the run
  # warns once per table that the cursor column should be indexed. 0 keeps every probe
  # running and turns the warning off.
  max-unindexed-scan-rows: 1000000
  metadata-query-timeout-seconds: 60
  # Grace period for in-flight cycles when the application shuts down; after this the
  # scheduler stops without waiting and open batches are rolled back. 0 skips the wait.
  shutdown-wait-ms: 20000
  # MySQL binlog CDC(v1.5.0)。长驻消费线程用独立的短租约(崩溃后其他节点在
  # lock-ttl + supervise-interval 内接管);断线指数退避重连;伪装 replica 的
  # server-id = server-id-offset + projectId,须避开源库与真实从库的 id。
  cdc:
    reconnect-backoff-ms: 1000
    reconnect-backoff-max-ms: 60000
    server-id-offset: 612000
    lock-ttl-ms: 30000
    supervise-interval-ms: 10000
    connect-timeout-ms: 10000
    # 单个源事务的缓冲上限(一个源事务 = 一个目标提交,提交前必须整笔驻留内存)。
    # 超限按非瞬态失败停车,而不是 OOM → 重连 → 重放同一事务;0 表示该维度不限。
    max-transaction-rows: 1000000
    max-transaction-bytes: 536870912
    # Oracle LogMiner(v1.6.0)。行外(out-of-line)LOB 在 SQL_REDO 中没有取值,无法还原:
    # skip 计数 + 限流告警后继续,fail 在第一条此类变更处停住且不推进位点。两者都会在
    # CDC 状态面板的 skippedMissingLob / missingLobByTable 中可见。
    logminer:
      missing-lob-policy: skip
  # 大字段与流式(v1.7.8)。大文本/大二进制不再整块读入堆内存:不超过 inline-max-bytes
  # 的值内联,更大的值流式读写,CDC 事务缓冲中超出的值先落到 spill-dir 并按事务边界删除。
  # 关闭 streaming-enabled 即回到 1.7.7 的整块读取行为。
  lob:
    streaming-enabled: true
    inline-max-bytes: 65536
    cdc-spill-threshold-bytes: 1048576
    # 单批累计字节上限;达到即先提交,单个值超过预算时独占一批。0 表示不检查。
    batch-max-bytes: 16777216
    # 主键/游标/清洗规则涉及的列必须物化,这是它们的上限,超出会报错并指明表与列。
    force-inline-max-bytes: 1048576
    # 临时文件目录只清理本工具前缀(jync-lob-*)的文件;启动时删除超过保留期的残留。
    spill-dir: ${java.io.tmpdir}/jync-lob
    spill-max-bytes: 1073741824
    spill-retention-hours: 24
    # PostgreSQL/openGauss 源库:读取期间保持只读事务,fetch size 才会真正生效
    # (否则驱动一次缓冲整个结果集)。代价是读取期间源库 vacuum 被推迟。
    enable-source-streaming: true
    # Oracle CLOB 目标:空串绑定为空 CLOB 而不是 NULL(VARCHAR2/CHAR 目标仍为 NULL)。
    oracle-empty-string-as-empty-clob: true
    # 统计日志与限流告警(LogMiner 缺失 LOB)的间隔。
    metrics-log-interval-ms: 60000
  # Encryption key for stored database passwords. Leave at these defaults on a FRESH install:
  # CryptoKeyBootstrap generates a strong secret on first boot and persists it beside the
  # database (<name>.key), so a new deployment is protected without any manual step. Set both
  # explicitly to manage the key yourself (e.g. via env vars), in which case nothing is generated.
  # NOTE: the literals below are deliberately kept at their pre-rename default — stored
  # connection passwords were AES-encrypted with them, and changing the default would make
  # every existing installation's saved credentials undecryptable after upgrade. An existing
  # database therefore boots with them and LegacyCryptoKeyMigration then re-encrypts every
  # stored secret under a generated key, promoting it to <name>.key once the rows commit.
  crypto-password: synctool-default-key-change-me
  crypto-salt: 5c0744940b5c369b
  ai:
    # AI-assisted procedure conversion. This is the only feature that can talk to anything
    # outside the two databases, and it stays inert until a provider is configured AND
    # enabled in the UI -- a stock install makes no outbound request. Set to false to remove
    # the feature entirely (menu and REST endpoints) on an air-gapped deployment.
    enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
  file:
    name: ./logs/jync.log
  # 系统日志页按 UTF-8 读文件。JDK 17 在中文 Windows 上默认字符集是 GBK，
  # 不固定编码会把中文写进日志再读成乱码；固定后与读取端一致，也不受平台影响。
  charset:
    file: UTF-8
  # 日志文件的上限。Spring Boot 默认只按时长保留（7 天）且没有总量上限，长期运行会把
  # ./logs 撑到数十 GB；这里给出明确的单文件大小、保留天数与总量三重限制。
  # 清理在启动时也会执行一次，因此异常退出留下的 .tmp 中转文件与超限历史会被回收。
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB
      clean-history-on-start: true
