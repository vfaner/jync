spring:
  application:
    name: jync
  datasource:
    # AUTO_SERVER lets an external tool inspect the store while the app runs.
    # H2 2.x rejects combining it with DB_CLOSE_ON_EXIT, so that flag is omitted.
    # Upgrades from SyncTool (<= 1.2.x): LegacyStoreMigration renames a synctool.mv.db
    # sitting next to the effective store path, so no data is lost. A deployment whose
    # overridden URL still names .../synctool keeps using that exact file, untouched.
    url: jdbc:h2:file:./data/jync;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: jync-meta
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    encoding: UTF-8
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    resources:
      cache:
        # 保持 0 是有意的：发布走"同版本覆盖"（v1.3.1 被重传过多次），URL 上的
        # v=${appVersion} 参数在覆盖后不变，长缓存期会让浏览器拿着旧 app.js 不放。
        # 0 = 每次都带条件请求，未变返回 304，代价只是一次往返。
        period: 0
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: jync-scheduler
      org.quartz.threadPool.threadCount: "10"
  h2:
    console:
      enabled: false

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        http-only: true
        # Lax lets top-level navigations carry the cookie but blocks CSRF-prone cross-site posts.
        same-site: lax
        # HTTPS deployments should set JYN_COOKIE_SECURE=true; left overridable so a plain
        # http://localhost deployment keeps working out of the box.
        secure: ${JYN_COOKIE_SECURE:false}

app:
  # Repository link behind the nav GitHub icon and the donate dialog buttons.
  github-url: https://github.com/vfaner/jync
  # 设置页「项目与作者」栏：Gitee 镜像地址、官网与作者联系方式，留空则对应行不显示。
  # 多个 QQ 号可用 / 、英文逗号或空格分隔，页面自动拆成独立行并生成 tencent:// 唤起会话链接。
  gitee-url: https://gitee.com/super_rgh/jync
  site-url: https://jync.qqmu.com
  contact-qq: 817094/2912167928
  contact-qq-group: 426669837
  contact-email: vfaner@88.com
  contact-wechat: qqmu66
  # 设置页的新版本检查：先查 GitHub API，失败/超时自动改查 Gitee（app.gitee-url）；
  # 成功结果缓存 10 分钟、失败缓存 1 分钟，过期后台重试，检查失败页面会提示稍后自动重试。
  # 纯内网两个平台都访问不了时建议关闭（一键升级入口也随之消失）。
  update-check:
    enabled: true
    # 单次请求超时（毫秒）：GitHub 超过这个时长仍无结果即切换 Gitee
    timeout-ms: 5000

sync:
  # Default polling interval in milliseconds for change detection
  poll-interval: 2000
  # Max retry attempts for a failed sync unit before it is logged as an error
  max-retries: 3
  # JDBC batch size for incremental windows and CDC replay (live traffic; keep it small)
  batch-size: 500
  # Fetch size hint applied to incremental source result sets
  fetch-size: 1000
  # Rows per JDBC batch of the initial/full load only. Independent of batch-size: a full load
  # has no live traffic to protect, so fewer/larger commits are safe there. Clamped to 20000.
  full-load-batch-size: 2000
  # Cursor fetch size of the initial/full load only. Clamped to 20000.
  full-load-fetch-size: 2000
  # Initial load into an EMPTY Oracle target writes INSERT instead of MERGE (measured ~2.5x
  # faster: nothing can match on an empty table, so the match test buys nothing). The target
  # is probed once per table load; a table that already has rows keeps the idempotent MERGE.
  # Other target databases are unaffected.
  oracle-initial-load-insert-first: true
  # A newly created table's non-unique secondary indexes are built AFTER its initial load,
  # not while the rows arrive: maintaining them per row roughly doubled the load in the
  # 500k-row Oracle benchmark (11.1s vs 5.9s), while creating both afterwards took 0.5s.
  # The primary key (inside CREATE TABLE) and unique indexes are always created immediately:
  # the upsert needs the PK, and a unique index must catch duplicate source rows as they
  # arrive. Structure-only projects (no data load) still create every index up front.
  defer-secondary-indexes: true
  # Rows per keyset chunk of an initial full load; each chunk commits and checkpoints on its
  # own, so a crash mid-table resumes at the last chunk instead of re-reading everything.
  # 0 disables chunking (classic single streamed read). Keyless tables never chunk.
  chunk-size: 100000
  # Worker threads for one chunked initial full load. Requires a single-column integer primary
  # key (MIN/MAX range split); other tables stay sequential. Workers borrow their own
  # connections per chunk, so parallelism above max-pool-size just queues on the pool. Clamped
  # to 8, and further capped by the pool: max-pool-size - 1 for distinct endpoints,
  # (max-pool-size - 2) / 2 when source and target share one database config. A project may
  # override it (full-load performance card). Default 2 is balanced: the 500k-row Oracle
  # benchmark measured ~117k rows/s at 1, ~184k at 2 and ~216k at 4 (+18% for the last step).
  # Set 1 on databases that are shared with live traffic.
  full-load-parallelism: 2
  # Maximum connections in each per-database pool; a cycle borrows one connection per side
  max-pool-size: 5
  # Subtracted from the timestamp high-watermark so in-flight source transactions
  # that commit slightly out of clock order are not skipped. See SyncProperties.
  safety-lag-ms: 1000
  # How often, at most, to re-count both sides of a table and confirm the target still
  # holds every row the cursor claims to have delivered. Set to 0 to disable.
  # Costs one COUNT(*) per side per table, hence the throttle.
  row-count-audit-interval-ms: 60000
  # Row count ceiling under which a table with no usable cursor column is
  # synchronized by full comparison instead of being skipped
  full-compare-max-rows: 20000
  # TTL for the per-project sync lock; a crashed node's lock expires after this
  lock-ttl-ms: 300000
  # 多实例控制面：每个节点定期把本地 Quartz 调度与数据库里的 enabled 标志对账，
  # 别的节点上启动/停用的项目最多经过一个间隔就会在本节点生效。单实例部署时
  # 对账始终无差异，纯属保险。
  reconcile-interval-ms: 30000
  # Statement timeout for data-plane queries; a lock wait or a dead socket otherwise parks the
  # worker forever. 0 disables. Metadata enumeration uses the shorter metadata-query-timeout.
  query-timeout-seconds: 300
  metadata-query-timeout-seconds: 60
  # Grace period for in-flight cycles when the application shuts down; after this the
  # scheduler stops without waiting and open batches are rolled back. 0 skips the wait.
  shutdown-wait-ms: 20000
  # MySQL binlog CDC(v1.5.0)。长驻消费线程用独立的短租约(崩溃后其他节点在
  # lock-ttl + supervise-interval 内接管);断线指数退避重连;伪装 replica 的
  # server-id = server-id-offset + projectId,须避开源库与真实从库的 id。
  cdc:
    reconnect-backoff-ms: 1000
    reconnect-backoff-max-ms: 60000
    server-id-offset: 612000
    lock-ttl-ms: 30000
    supervise-interval-ms: 10000
    connect-timeout-ms: 10000
  # Encryption key for stored database passwords. Leave at these defaults on a FRESH install:
  # CryptoKeyBootstrap generates a strong secret on first boot and persists it beside the
  # database (<name>.key), so a new deployment is protected without any manual step. Set both
  # explicitly to manage the key yourself (e.g. via env vars), in which case nothing is generated.
  # NOTE: the literals below are deliberately kept at their pre-rename default — stored
  # connection passwords were AES-encrypted with them, and changing the default would make
  # every existing installation's saved credentials undecryptable after upgrade. An existing
  # database therefore keeps them (see CryptoKeyResolver).
  crypto-password: synctool-default-key-change-me
  crypto-salt: 5c0744940b5c369b
  ai:
    # AI-assisted procedure conversion. This is the only feature that can talk to anything
    # outside the two databases, and it stays inert until a provider is configured AND
    # enabled in the UI -- a stock install makes no outbound request. Set to false to remove
    # the feature entirely (menu and REST endpoints) on an air-gapped deployment.
    enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
  file:
    name: ./logs/jync.log
