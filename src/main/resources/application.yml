spring:
  application:
    name: jync
  datasource:
    # AUTO_SERVER lets an external tool inspect the store while the app runs.
    # H2 2.x rejects combining it with DB_CLOSE_ON_EXIT, so that flag is omitted.
    # Upgrades from SyncTool (<= 1.2.x): LegacyStoreMigration renames a synctool.mv.db
    # sitting next to the effective store path, so no data is lost. A deployment whose
    # overridden URL still names .../synctool keeps using that exact file, untouched.
    url: jdbc:h2:file:./data/jync;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: jync-meta
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    encoding: UTF-8
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    resources:
      cache:
        # 保持 0 是有意的：发布走"同版本覆盖"（v1.3.1 被重传过多次），URL 上的
        # v=${appVersion} 参数在覆盖后不变，长缓存期会让浏览器拿着旧 app.js 不放。
        # 0 = 每次都带条件请求，未变返回 304，代价只是一次往返。
        period: 0
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: jync-scheduler
      org.quartz.threadPool.threadCount: "10"
  h2:
    console:
      enabled: false

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        http-only: true
        # Lax lets top-level navigations carry the cookie but blocks CSRF-prone cross-site posts.
        same-site: lax
        # HTTPS deployments should set JYN_COOKIE_SECURE=true; left overridable so a plain
        # http://localhost deployment keeps working out of the box.
        secure: ${JYN_COOKIE_SECURE:false}

app:
  # Repository link behind the nav GitHub icon and the donate dialog buttons.
  github-url: https://github.com/vfaner/jync
  # 设置页「项目与作者」栏：Gitee 镜像地址、官网与作者联系方式，留空则对应行不显示。
  gitee-url: https://gitee.com/super_rgh/jync
  site-url: https://jync.qqmu.com
  contact-qq: 817094/2912167928
  contact-qq-group: 426669837
  contact-wechat: qqmu66
  # 设置页的新版本检查（调用 GitHub API，成功结果缓存 10 分钟、失败缓存 1 分钟）。
  # 纯内网无法访问 GitHub 时建议关闭。
  update-check:
    enabled: true

sync:
  # Default polling interval in milliseconds for change detection
  poll-interval: 2000
  # Max retry attempts for a failed sync unit before it is logged as an error
  max-retries: 3
  # JDBC batch size for data synchronization
  batch-size: 500
  # Fetch size hint applied to source result sets
  fetch-size: 1000
  # Maximum connections in each per-database pool; a cycle borrows one connection per side
  max-pool-size: 5
  # Subtracted from the timestamp high-watermark so in-flight source transactions
  # that commit slightly out of clock order are not skipped. See SyncProperties.
  safety-lag-ms: 1000
  # How often, at most, to re-count both sides of a table and confirm the target still
  # holds every row the cursor claims to have delivered. Set to 0 to disable.
  # Costs one COUNT(*) per side per table, hence the throttle.
  row-count-audit-interval-ms: 60000
  # Row count ceiling under which a table with no usable cursor column is
  # synchronized by full comparison instead of being skipped
  full-compare-max-rows: 20000
  # TTL for the per-project sync lock; a crashed node's lock expires after this
  lock-ttl-ms: 300000
  # 多实例控制面：每个节点定期把本地 Quartz 调度与数据库里的 enabled 标志对账，
  # 别的节点上启动/停用的项目最多经过一个间隔就会在本节点生效。单实例部署时
  # 对账始终无差异，纯属保险。
  reconcile-interval-ms: 30000
  # Statement timeout for data-plane queries; a lock wait or a dead socket otherwise parks the
  # worker forever. 0 disables. Metadata enumeration uses the shorter metadata-query-timeout.
  query-timeout-seconds: 300
  metadata-query-timeout-seconds: 60
  # Grace period for in-flight cycles when the application shuts down; after this the
  # scheduler stops without waiting and open batches are rolled back. 0 skips the wait.
  shutdown-wait-ms: 20000
  # Encryption key for stored database passwords. OVERRIDE THIS IN PRODUCTION.
  # NOTE: the default value is deliberately kept at its pre-rename literal — stored
  # connection passwords were AES-encrypted with it, and changing it would make
  # every existing installation's saved credentials undecryptable after upgrade.
  crypto-password: synctool-default-key-change-me
  crypto-salt: 5c0744940b5c369b
  ai:
    # AI-assisted procedure conversion. This is the only feature that can talk to anything
    # outside the two databases, and it stays inert until a provider is configured AND
    # enabled in the UI -- a stock install makes no outbound request. Set to false to remove
    # the feature entirely (menu and REST endpoints) on an air-gapped deployment.
    enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
  file:
    name: ./logs/jync.log
