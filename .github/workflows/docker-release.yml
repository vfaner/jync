name: Docker image

# 发布 tag（v2.4.4 这种）时构建官方镜像；也可以在 Actions 页面手动指定 tag 运行。
# 推送目标：
#   Docker Hub  vfaner/jync:<tag> / :latest   —— 需要 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#   GHCR        ghcr.io/vfaner/jync:<tag> / :latest —— 使用 GITHUB_TOKEN，无需额外配置
# 双架构：linux/amd64 + linux/arm64（Apple Silicon / ARM 服务器可直接拉取）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v2.4.4）'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "semver=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vfaner/jync:${{ steps.version.outputs.semver }}
            ghcr.io/vfaner/jync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (Docker Hub)
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            vfaner/jync:${{ steps.version.outputs.semver }}
            vfaner/jync:latest
          cache-from: type=gha
